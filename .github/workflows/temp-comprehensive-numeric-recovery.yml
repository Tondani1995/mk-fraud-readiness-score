name: Temporary Comprehensive Numeric Recovery

on:
  push:
    branches:
      - hotfix/comprehensive-numeric-recovery-20260905

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-numeric-recovery-20260905
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply bounded numeric recovery patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = Path('src/lib/reports/narrative/whole-manuscript-recovery.ts')
          s = recovery.read_text()
          old = "const localEligible = Boolean(target && targetIssue && (semanticIssues.includes(targetIssue) || localAssuranceEligible(checked.validation, checked.parsed)));"
          new = """const localEligible = Boolean(target && targetIssue && (\n      semanticIssues.includes(targetIssue)\n      || localAssuranceEligible(checked.validation, checked.parsed)\n      // Comprehensive may repair an unsupported numeric sentence only by replacing the\n      // bounded paragraph from its permitted deterministic facts. The unchanged final\n      // validator still decides release, so unsupported numbers can never pass through.\n      || (input.strictHardTruth && targetIssue.code === 'unsupported_numeric_claim')\n    ));"""
          if old not in s:
            raise SystemExit('recovery localEligible anchor not found')
          recovery.write_text(s.replace(old, new, 1))

          severity = Path('src/lib/reports/narrative/validation-severity.ts')
          s = severity.read_text()
          anchor = """export function classifyNarrativeRecoveryIssue(input: NarrativeRecoveryIssueInput): ClassifiedNarrativeIssue {\n  const base = classifyNarrativeIssue(input.code);\n  if (input.code === 'assurance_claim' && input.localSemanticEligible) {"""
          replacement = """export function classifyNarrativeRecoveryIssue(input: NarrativeRecoveryIssueInput): ClassifiedNarrativeIssue {\n  const base = classifyNarrativeIssue(input.code);\n  if (input.code === 'unsupported_numeric_claim' && input.localSemanticEligible) {\n    return {\n      ...base,\n      severity: 'REPAIRABLE_SEMANTIC_FAILURE',\n      repairEligible: true,\n      rationale: 'An unsupported numeric claim remains release-blocking, but a bounded paragraph replacement may remove it using only the permitted deterministic facts and must pass the unchanged numeric validator before release.'\n    };\n  }\n  if (input.code === 'assurance_claim' && input.localSemanticEligible) {"""
          if anchor not in s:
            raise SystemExit('validation severity anchor not found')
          severity.write_text(s.replace(anchor, replacement, 1))

          writer = Path('src/lib/reports/narrative/whole-manuscript-writer-comprehensive.ts')
          s = writer.read_text()
          marker = "    'CUSTOMER FACT BOUNDARY. Do not compare this organisation with peers, similar-sized organisations, industry averages, benchmarks, medians or percentiles unless an explicit deterministic benchmark fact is supplied. Do not infer or state employee or staff counts. Do not say or imply that knowledge or control responsibility sits with \"one or two people\", \"a single employee\" or any other invented concentration of people. Do not invent organisational structures, committees, executive titles or functions; use only those present in the permitted deterministic facts. Where a fact is not in the permitted deterministic material, express the management implication without inventing it.',"
          numeric_rule = "    'NUMERIC FACT BOUNDARY. Within each paragraph, use a digit or percentage only when that exact value is present in that section or subsection permitted deterministic facts. Do not invent counts, durations, percentages, thresholds, stage numbers, sequence numbers, time horizons, sample sizes or frequencies. If a quantitative detail is not explicitly permitted for that paragraph, express the management implication without a number. Never spell an unsupported number in words to bypass this boundary.',"
          count = s.count(marker)
          if count != 2:
            raise SystemExit(f'expected 2 customer fact boundary anchors, found {count}')
          s = s.replace(marker, marker + "\n" + numeric_rule)
          repair_anchor = "    'The assurance boundary remains strict: do not imply that MK, the assessment, the report or any external reviewer independently verified evidence or operating effectiveness. Customer-owned control design may describe what management should independently review or verify. Do not use em dashes. Use normal sentence punctuation instead.',"
          repair_extra = """    ...(input.validationCode === 'unsupported_numeric_claim' ? [\n      'NUMERIC REPAIR. Remove every unsupported quantitative claim from the target block. Do not preserve an unsupported quantity by spelling the number in words. Do not introduce a new count, duration, percentage, threshold, stage number, sequence, time horizon, sample size or frequency unless it appears explicitly in PERMITTED FACTS. If no permitted number is needed, preserve only the management implication using non-quantitative wording.'\n    ] : []),"""
          if repair_anchor not in s:
            raise SystemExit('repair prompt anchor not found')
          s = s.replace(repair_anchor, repair_anchor + "\n" + repair_extra, 1)
          writer.write_text(s)

          fulfil = Path('src/lib/reports/phase1-manual-fulfilment.ts')
          s = fulfil.read_text()
          diag_anchor = "          hardIssuePaths: hardIssues.map((issue: any) => String(issue?.path ?? 'unknown')).slice(0, 20),"
          diag_extra = "          hardIssueMessages: hardIssues.map((issue: any) => String(issue?.message ?? 'unknown').slice(0, 240)).slice(0, 20),"
          if diag_anchor not in s:
            raise SystemExit('diagnostics anchor not found')
          fulfil.write_text(s.replace(diag_anchor, diag_anchor + "\n" + diag_extra, 1))

          test = Path('scripts/commercial-quality/whole-manuscript-recovery-tests.mjs')
          s = test.read_text()
          test_anchor = """assert.equal(classifyNarrativeIssue('customer_copy_leakage').repairEligible, true);\nassert.match(repaired.markdown, /reviewed by management/);"""
          test_insert = """assert.equal(classifyNarrativeIssue('customer_copy_leakage').repairEligible, true);\nassert.equal(classifyNarrativeIssue('unsupported_numeric_claim').repairEligible, false);\nassert.equal(classifyNarrativeRecoveryIssue({ code: 'unsupported_numeric_claim', localSemanticEligible: true }).repairEligible, true);\n\nconst numericBad = complete.replace(/## What management should take away\\n\\n[^\\n]+/, '## What management should take away\\n\\nManagement should preserve the recorded position within 999999 days.');\nconst numericValidation = validateBlueprintTextManuscript(parseBlueprintMarkdown(numericBad, blueprint), blueprint, facts);\nassert.equal(numericValidation.hardTruth.issues.some((issue) => issue.code === 'unsupported_numeric_claim'), true);\nlet numericRepairCalls = 0;\nconst numericWriter = {\n  ...writer,\n  async repairBlock(input) {\n    numericRepairCalls += 1;\n    assert.equal(input.validationCode, 'unsupported_numeric_claim');\n    return { contractVersion: 'mk-reporting-bible-1.1-whole-manuscript-writer-v1', architecture: 'whole-manuscript-targeted-repair', repairedText: 'Management should preserve the recorded position through a clear management response.', blueprint, writerMetadata: { ...baseCandidate('', { ...emptyNarrativeRecoveryBudget(), targetedRepairCount: 1, totalCalls: 1 }).writerMetadata } };\n  }\n};\nconst numericRepaired = await recoverWholeManuscript({ writer: numericWriter, context, blueprint, factPack: facts, initialResult: baseCandidate(numericBad), attemptIdentity: 'case-strict-numeric', diagnosticsRootDirectory: root, runCoherence: false, strictHardTruth: true });\nassert.equal(numericRepairCalls, 1);\nassert.equal(numericRepaired.validation.ok, true);\nassert.doesNotMatch(numericRepaired.markdown, /999999/);\n\nassert.match(repaired.markdown, /reviewed by management/);"""
          if test_anchor not in s:
            raise SystemExit('test insertion anchor not found')
          s = s.replace(test_anchor, test_insert, 1)
          s = s.replace("'strict Comprehensive mode permits only explicitly repairable customer-copy defects',", "'strict Comprehensive mode permits only explicitly repairable bounded defects', 'unsupported numeric claims receive bounded paragraph repair but remain release-blocking until revalidation',")
          s = s.replace("repairCalls: repairCalls + failingRepairCalls + strictRepairCalls", "repairCalls: repairCalls + failingRepairCalls + strictRepairCalls + numericRepairCalls")
          test.write_text(s)
          PY
      - name: Run focused recovery proof
        run: npm run v11:whole-manuscript-recovery
      - name: Typecheck
        run: npm run typecheck
      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --stat
          grep -q "NUMERIC FACT BOUNDARY" src/lib/reports/narrative/whole-manuscript-writer-comprehensive.ts
          grep -q "hardIssueMessages" src/lib/reports/phase1-manual-fulfilment.ts
      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-comprehensive-numeric-recovery.yml
          git config user.name "MK Comprehensive Numeric Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/narrative/whole-manuscript-recovery.ts \
                  src/lib/reports/narrative/validation-severity.ts \
                  src/lib/reports/narrative/whole-manuscript-writer-comprehensive.ts \
                  src/lib/reports/phase1-manual-fulfilment.ts \
                  scripts/commercial-quality/whole-manuscript-recovery-tests.mjs \
                  .github/workflows/temp-comprehensive-numeric-recovery.yml
          git commit -m "fix(comprehensive): recover unsupported numeric prose safely"
          git push origin HEAD:hotfix/comprehensive-numeric-recovery-20260905
