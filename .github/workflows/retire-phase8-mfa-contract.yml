name: Retire stale Phase 8 MFA contract

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/retire-phase8-mfa-contract.yml

permissions:
  contents: write

jobs:
  retire-stale-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-brand-20260824
          fetch-depth: 0

      - name: Remove retired MFA requirements from Phase 8 regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/phase8-admin-console-tests.mjs')
          s = p.read_text()
          s = s.replace("    '/admin/audit-log', '/admin/enquiries', '/admin/phase14-activation', '/admin/security'\n", "    '/admin/audit-log', '/admin/enquiries', '/admin/phase14-activation'\n")
          s = s.replace("// Phase 14 activation + MFA: routes and pages must exist, and the mutation routes must not\n// skip the AAL2 pre-check (defense-in-depth alongside the authoritative Postgres-side check).\n", "// Phase 14 activation routes must exist. Privileged mutations remain protected by\n// authenticated platform-admin role checks and the administrator's real session.\n")
          for retired in [
              "  'src/app/score/admin/security/page.tsx',\n",
              "  'src/app/score/api/admin/mfa/enroll/route.ts',\n",
              "  'src/app/score/api/admin/mfa/verify/route.ts',\n",
              "  'src/app/score/api/admin/mfa/factors/route.ts',\n",
              "  'src/app/score/api/admin/mfa/unenroll/route.ts',\n"
          ]:
              s = s.replace(retired, '')
          s = s.replace("  assert(fs.existsSync(path.join(root, route)), `Missing Phase 14 activation/MFA route: ${route}`);\n", "  assert(fs.existsSync(path.join(root, route)), `Missing Phase 14 activation route: ${route}`);\n")
          s = s.replace("  assertIncludes(route, 'decodeAalClaimForDisplayOnly', `${route} must pre-check AAL2 before calling its RPC (defense-in-depth; Postgres remains authoritative)`);\n", '')
          stale_verify = "// The MFA verify route must actually persist the fresh aal2 session back into cookies - a\n// success response that leaves the old aal1 cookie in place would silently strand the admin at\n// aal1 despite the app claiming MFA succeeded.\nassertIncludes('src/app/score/api/admin/mfa/verify/route.ts', 'setAdminSessionCookies', 'MFA verify route must write the new aal2 session back into cookies after a successful verify');\n\n"
          s = s.replace(stale_verify, '')
          p.write_text(s)
          PY

          if grep -nEi "admin/security|api/admin/mfa|decodeAalClaimForDisplayOnly|AAL2 pre-check|MFA verify" scripts/phase8-admin-console-tests.mjs; then
            echo '::error::Stale MFA/AAL2 Phase 8 contract remains.'
            exit 1
          fi

          printf '\n# Phase 8 MFA contract retired; rerun against current admin contract.\n' >> .github/workflows/remove-mfa-aal2.yml
          git rm .github/workflows/retire-phase8-mfa-contract.yml
          git diff --check
          git config user.name "MK Platform Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retire stale Phase 8 MFA regression contract"
          git push origin HEAD:recovery/essential-v10-v12-brand-20260824
