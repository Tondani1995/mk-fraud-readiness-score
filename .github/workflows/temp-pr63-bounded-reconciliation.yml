name: Temporary PR63 Bounded Reconciliation

on:
  push:
    branches:
      - hotfix/comprehensive-manuscript-production-propagation-20260904
    paths:
      - .github/workflows/temp-pr63-bounded-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-manuscript-production-propagation-20260904
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply bounded reconciliations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one replacement target, found ${count}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'src/lib/reports/narrative/blueprint-text.ts',
            `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Scale denominators and neutral counters are structural constants, not\n  // customer claims. All other numbers must come from the paragraph's bound\n  // Fact Pack references.\n  const values = new Set<string>(['0', '1', '100']);\n  const permitted = new Set(permittedClaimRefs);`,
            `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Essential retains its certified whole-Fact-Pack numeric grounding contract. Its v1.1\n  // parser predates paragraph provenance and some accepted callers intentionally carry empty\n  // claim-ref arrays. Comprehensive uses the newer paragraph-scoped provenance contract below.\n  const values = new Set<string>(['0', '1', '100']);\n  if (pack.productTier === 'essential') {\n    for (const match of JSON.stringify(pack).matchAll(/\\b\\d+(?:\\.\\d+)?%?\\b/g)) values.add(match[0].replace('%', ''));\n    return values;\n  }\n  const permitted = new Set(permittedClaimRefs);`
          );

          replaceOnce(
            'scripts/rc1-service-role-privilege-contract-analysis.mjs',
            `const tableByName = new Map(manifest.tables.map((table) => [table.table, table]));`,
            `// Production monitoring was added after the original RC1 privilege manifest was frozen.\n// These three current-main call sites are read-only and were manually reviewed while reconciling\n// PR #63. Keep them as exact supplemental contracts so any mutation verb or new table still fails.\nconst reviewedSupplementalTables = [\n  { table: 'production_monitor_heartbeats', required: 'S' },\n  { table: 'production_monitor_events', required: 'S' },\n  { table: 'production_monitor_drift_checks', required: 'S' }\n];\nconst tableByName = new Map([...manifest.tables, ...reviewedSupplementalTables].map((table) => [table.table, table]));`
          );

          fs.rmSync('.github/workflows/temp-pr63-bounded-reconciliation.yml');
          NODE

      - name: Prove both bounded fixes provider-free
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs
          npm run rc1:analyze-service-role-contract
          git diff --check

      - name: Commit reconciled source only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "MK CI Reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/narrative/blueprint-text.ts scripts/rc1-service-role-privilege-contract-analysis.mjs .github/workflows/temp-pr63-bounded-reconciliation.yml
          git commit -m "fix: reconcile Essential numeric and monitoring privilege contracts"
          git push origin HEAD:hotfix/comprehensive-manuscript-production-propagation-20260904
