name: Temporary PR63 Focused Reconciliation

on:
  push:
    branches:
      - hotfix/comprehensive-manuscript-production-propagation-20260904
    paths:
      - .github/workflows/temp-pr63-bounded-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-manuscript-production-propagation-20260904
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Keep only the approved Comprehensive engine propagation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .gitleaksignore package-lock.json scripts/rc1-service-role-privilege-contract-analysis.mjs

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/reports/narrative/blueprint-text.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Scale denominators and neutral counters are structural constants, not\n  // customer claims. All other numbers must come from the paragraph's bound\n  // Fact Pack references.\n  const values = new Set<string>(['0', '1', '100']);\n  const permitted = new Set(permittedClaimRefs);`;
          const after = `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Essential keeps its certified whole-Fact-Pack numeric grounding behaviour.\n  // Comprehensive uses the paragraph-scoped provenance contract below.\n  const values = new Set<string>(['0', '1', '100']);\n  if (pack.productTier === 'essential') {\n    for (const match of JSON.stringify(pack).matchAll(/\\b\\d+(?:\\.\\d+)?%?\\b/g)) values.add(match[0].replace('%', ''));\n    return values;\n  }\n  const permitted = new Set(permittedClaimRefs);`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one scopedNumericValues target, found ${count}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE

          rm .github/workflows/temp-pr63-bounded-reconciliation.yml

      - name: Verify Essential was not changed by the shared validator update
        run: npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs

      - name: Typecheck the propagated Comprehensive engine
        run: npm run typecheck

      - name: Verify clean patch
        run: git diff --check

      - name: Commit the focused propagation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MK CI Reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(comprehensive): attach approved manuscript-first engine only"
          git push origin HEAD:hotfix/comprehensive-manuscript-production-propagation-20260904
