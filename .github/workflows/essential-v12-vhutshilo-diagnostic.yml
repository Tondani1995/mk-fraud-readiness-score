name: Essential V1.2 Vhutshilo Semantic Diagnostic

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/essential-v12-vhutshilo-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mk-fraud-platform-cbz0nevjk-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - name: Capture exact response without hiding a failure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_PROTECTION_BYPASS"
          mkdir -p qa-output/v12-vhutshilo-diagnostic
          code=$(curl -sS -w '%{http_code}' -D qa-output/v12-vhutshilo-diagnostic/headers.txt -o qa-output/v12-vhutshilo-diagnostic/response.bin -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/vhutshilo")
          printf '%s\n' "$code" > qa-output/v12-vhutshilo-diagnostic/http-code.txt
          if [ "$code" = "200" ]; then
            mv qa-output/v12-vhutshilo-diagnostic/response.bin qa-output/v12-vhutshilo-diagnostic/Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf
          else
            mv qa-output/v12-vhutshilo-diagnostic/response.bin qa-output/v12-vhutshilo-diagnostic/response.json
          fi
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-vhutshilo-diagnostic
          git commit -m "capture Vhutshilo V1.2 semantic diagnostic from 8779a6a"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
