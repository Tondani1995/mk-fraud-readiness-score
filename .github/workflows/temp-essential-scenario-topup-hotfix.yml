name: Temporary Essential Scenario Top-up Hotfix

on:
  push:
    branches:
      - hotfix/essential-scenario-topup-20260905

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/essential-scenario-topup-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded scenario top-up correction
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/reports/evidence-model/scenarios.ts')
          text = path.read_text()
          old = '''  if (scenarios.length < minimum) {
    const represented = new Set(scenarios.flatMap((scenario) => scenario.linkedFindingIds));
    const topUps = [...findings]
      .filter((finding) => !represented.has(finding.id))
      .filter((finding) => weakAssessment ? finding.materialityClass !== 'assurance_priority' : finding.materialityClass === 'assurance_priority')
      .sort((a, b) => b.materialityScore - a.materialityScore || a.questionCode.localeCompare(b.questionCode));
    for (const finding of topUps) {
      if (scenarios.length >= minimum) break;
      const risk = risks.find((item) => item.linkedFindingIds.includes(finding.id));
      if (risk) scenarios.push(scenarioForRisk(risk, [finding], finding.questionCode));
    }
  }
'''
          new = '''  if (scenarios.length < minimum) {
    // A consolidated risk can legitimately carry several material findings. The primary scenario
    // represents that consolidated pathway, but it must not mark every linked finding as exhausted:
    // doing so can leave a weak assessment with only one scenario even when several distinct,
    // evidence-backed control conditions exist. Preserve the primary lead, then use the next
    // highest-materiality linked findings as bounded variants until the evidence-model minimum is met.
    const primaryLeadFindingIds = new Set<string>();
    for (const risk of eligibleRisks.slice(0, maximum)) {
      const linked = findings
        .filter((finding) => risk.linkedFindingIds.includes(finding.id))
        .filter((finding) => weakAssessment ? finding.materialityClass !== 'assurance_priority' : finding.materialityClass === 'assurance_priority')
        .sort((a, b) => b.materialityScore - a.materialityScore || a.questionCode.localeCompare(b.questionCode));
      if (linked[0]) primaryLeadFindingIds.add(linked[0].id);
    }

    const topUps = [...findings]
      .filter((finding) => !primaryLeadFindingIds.has(finding.id))
      .filter((finding) => weakAssessment ? finding.materialityClass !== 'assurance_priority' : finding.materialityClass === 'assurance_priority')
      .filter((finding) => eligibleRisks.some((risk) => risk.linkedFindingIds.includes(finding.id)))
      .sort((a, b) => b.materialityScore - a.materialityScore || a.questionCode.localeCompare(b.questionCode));
    for (const finding of topUps) {
      if (scenarios.length >= minimum) break;
      const risk = eligibleRisks.find((item) => item.linkedFindingIds.includes(finding.id));
      if (risk) scenarios.push(scenarioForRisk(risk, [finding], finding.questionCode));
    }
  }
'''
          if old not in text:
            raise SystemExit('target scenario top-up block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Regression proof for consolidated risk
        run: |
          cat > .tmp-essential-scenario-topup-test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { buildPlausibleScenarios } from './src/lib/reports/evidence-model/scenarios.ts';

          const finding = (id, questionCode, materialityScore, scenarioType) => ({
            id, questionCode, materialityScore,
            materialityClass: 'material_weakness',
            linkedScenarioTypes: [scenarioType],
            fraudMechanism: 'a recorded control weakness may enable misuse',
            domainName: 'Test domain',
            responseMeaning: 'Partly designed',
            expectedControlStandard: 'Independent preventive and detective control',
            escalationThreshold: 'Any unresolved exception is escalated',
            accountableOwner: 'Executive owner',
            recommendedControl: 'Implement and evidence the required control.',
            questionPrompt: `Control question ${questionCode}.`
          });

          const findings = [
            finding('MF-1', 'D1-Q01', 100, 'privileged_access_exploitation'),
            finding('MF-2', 'D1-Q02', 90, 'segregation_of_duties_bypass'),
            finding('MF-3', 'D1-Q03', 80, 'access_abuse')
          ];
          const risk = {
            id: 'RISK-CONSOLIDATED',
            priority: 'Critical',
            title: 'Consolidated control pathway',
            riskEvent: 'unauthorised activity proceeds without timely challenge',
            financialImpact: 'Value may be lost',
            operationalImpact: 'Operations may be disrupted',
            legalRegulatoryImpact: null,
            reputationalImpact: null,
            linkedFindingIds: findings.map((item) => item.id)
          };

          const scenarios = buildPlausibleScenarios({}, findings, [risk]);
          assert.equal(scenarios.length, 3, 'one consolidated risk with three distinct findings must yield the weak-assessment minimum of three evidence-backed scenarios');
          assert.equal(new Set(scenarios.map((item) => item.id)).size, 3, 'scenario ids must remain unique');
          assert.ok(scenarios.every((item) => item.linkedRiskIds.includes(risk.id)), 'every scenario must retain the authoritative consolidated risk link');
          assert.ok(scenarios.every((item) => item.evidenceRefs.length > 0), 'every scenario must retain evidence provenance');
          console.log('PASS: consolidated-risk scenario top-up regression');
          EOF
          node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs .tmp-essential-scenario-topup-test.mjs
          rm .tmp-essential-scenario-topup-test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/temp-essential-scenario-topup-hotfix.yml
          git config user.name "MK Essential Scenario Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/evidence-model/scenarios.ts .github/workflows/temp-essential-scenario-topup-hotfix.yml
          git commit -m "fix(essential): preserve evidence-backed scenario minimum"
          git push origin HEAD:hotfix/essential-scenario-topup-20260905
