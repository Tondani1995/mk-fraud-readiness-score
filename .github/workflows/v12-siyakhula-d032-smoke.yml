name: V1.2 Siyakhula Final Safety Smoke
on:
  push:
    branches: [qa/v12-essential-five-layer-proof-20260823]
    paths: [.github/workflows/v12-siyakhula-d032-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mk-fraud-platform-b2h2p5gs0-tondanis-projects.vercel.app
      SOURCE_DEPLOYMENT: dpl_DBsdLHhbaAVEmaeGqgpQxKqq7e3e
      SOURCE_SHA: d032ba3b8f0db46f927d8572d4dd6850b3d5caa0
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - name: Prove safety and generate Siyakhula once
        shell: bash
        run: |
          set -u
          test -n "$VERCEL_PROTECTION_BYPASS" || exit 1
          out=qa-output/v12-siyakhula-d032
          rm -rf "$out" && mkdir -p "$out"
          safety=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-safety-proof")
          printf '%s\n' "$safety" > "$out/safety.json"
          printf '%s' "$safety" | grep -Fq '"ok":true' || exit 1
          printf '%s' "$safety" | grep -Fq '"ratherThanAssuranceLimitation":{"publishable":true,"finalDisposition":"ACCEPT"' || exit 1
          meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/siyakhula?format=meta")
          printf '%s\n' "$meta" > "$out/meta.json"
          code=$(curl -sS -w '%{http_code}' -D "$out/headers.txt" -o "$out/response.bin" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/siyakhula")
          printf '%s\n' "$code" > "$out/http-code.txt"
          node -e "require('fs').writeFileSync('$out/source.json', JSON.stringify({sourceDeployment:process.env.SOURCE_DEPLOYMENT,sourceSha:process.env.SOURCE_SHA},null,2)+'\n')"
          if [ "$code" = 200 ] && head -c 4 "$out/response.bin" | grep -q '%PDF'; then
            mv "$out/response.bin" "$out/Siyakhula_Community_Foundation_Essential_V1_2.pdf"
            sha256sum "$out/Siyakhula_Community_Foundation_Essential_V1_2.pdf" > "$out/sha256.txt"
            echo success > "$out/outcome.txt"
          else
            mv "$out/response.bin" "$out/diagnostic.json"
            echo held_or_failed > "$out/outcome.txt"
          fi
      - name: Commit smoke evidence
        shell: bash
        run: |
          git config user.name 'MK V1.2 QA'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-output/v12-siyakhula-d032
          git commit -m 'capture Siyakhula proof on d032 V1.2 source' || true
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
      - name: Upload smoke
        uses: actions/upload-artifact@v4
        with:
          name: v12-siyakhula-d032-smoke
          path: qa-output/v12-siyakhula-d032/*
          retention-days: 14
