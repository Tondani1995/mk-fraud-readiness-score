name: One-off Essential numeric canonicalisation

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Apply deterministic numeric-claim equivalence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = """function canonicalNumericClaimToken(value: string): string {
  const stripped = value.replace('%', '');
  const parsed = Number(stripped);
  return Number.isFinite(parsed) ? String(parsed) : stripped;
}

"""

          for filename in [
              'src/lib/reports/narrative/blueprint-text.ts',
              'src/lib/reports/narrative/validation.ts'
          ]:
              path = Path(filename)
              text = path.read_text()
              if 'function canonicalNumericClaimToken' not in text:
                  anchor = 'function numericValues(pack: NarrativeFactPack): Set<string> {'
                  if anchor not in text:
                      raise SystemExit(f'numericValues anchor missing in {filename}')
                  text = text.replace(anchor, helper + anchor, 1)
              text = text.replace("values.add(match[0].replace('%', ''));", "values.add(canonicalNumericClaimToken(match[0]));")
              text = text.replace("knownNumbers.has(token.replace('%', ''))", "knownNumbers.has(canonicalNumericClaimToken(token))")
              text = text.replace("numbers.has(token.replace('%', ''))", "numbers.has(canonicalNumericClaimToken(token))")
              path.write_text(text)

          test_path = Path('scripts/commercial-quality/essential-numeric-claim-tests.mjs')
          test_path.write_text(r'''#!/usr/bin/env node
import assert from 'node:assert/strict';
import { validateBlueprintTextManuscript } from '../../src/lib/reports/narrative/blueprint-text.ts';

function parsedWith(text) {
  return {
    ok: true,
    markdown: `# Executive\n\n## Position\n\n${text}`,
    errors: [],
    chapters: [{
      chapterId: 'EXEC',
      title: 'Executive',
      sections: [{
        chapterId: 'EXEC',
        sectionId: 'POSITION',
        title: 'Position',
        permittedClaimRefs: [],
        paragraphs: [{ text, permittedClaimRefs: [] }],
        subsections: []
      }]
    }]
  };
}

const factPack = {
  bibleVersion: '1.1',
  productTier: 'essential',
  organisation: { name: 'Fixture' },
  facts: [{ id: 'score-20', kind: 'score', value: 20 }]
};

const equivalent = validateBlueprintTextManuscript(parsedWith('The recorded score is 20.00.'), {}, factPack);
assert.equal(equivalent.hardTruth.issues.some((issue) => issue.code === 'unsupported_numeric_claim'), false, '20.00 must be accepted when deterministic Fact Pack contains 20');

const equivalentPercent = validateBlueprintTextManuscript(parsedWith('The recorded score is 20.00%.'), {}, factPack);
assert.equal(equivalentPercent.hardTruth.issues.some((issue) => issue.code === 'unsupported_numeric_claim'), false, '20.00% must retain the existing percentage-insensitive numeric equivalence');

const unsupported = validateBlueprintTextManuscript(parsedWith('The recorded score is 20.01.'), {}, factPack);
assert.equal(unsupported.hardTruth.issues.some((issue) => issue.code === 'unsupported_numeric_claim'), true, 'A genuinely different numeric claim must still fail closed');

console.log(JSON.stringify({ status: 'PASS', ai: 'ZERO', numericSemanticEquivalence: 'PASS' }, null, 2));
''')

          workflow = Path('.github/workflows/essential-provider-diagnostics.yml')
          text = workflow.read_text()
          marker = "      - name: Run provider-free Comprehensive customer-visible regressions\n"
          step = "      - name: Prove Essential numeric claim equivalence provider-free\n        run: npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs\n\n"
          if step not in text:
              if marker not in text:
                  raise SystemExit('provider-free workflow insertion anchor missing')
              text = text.replace(marker, step + marker, 1)
              workflow.write_text(text)

          Path('.github/workflows/one-off-essential-numeric-canonicalisation.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/reports/narrative/blueprint-text.ts \
                  src/lib/reports/narrative/validation.ts \
                  scripts/commercial-quality/essential-numeric-claim-tests.mjs \
                  .github/workflows/essential-provider-diagnostics.yml \
                  .github/workflows/one-off-essential-numeric-canonicalisation.yml
          git commit -m "Fix Essential numeric claim semantic equivalence"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
