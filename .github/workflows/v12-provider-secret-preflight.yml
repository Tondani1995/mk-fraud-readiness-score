name: V1.2 Provider Secret Preflight

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/v12-provider-secret-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - name: Record provider credential availability only
        shell: bash
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
        run: |
          mkdir -p qa-output/v12-essential
          if [ -n "$AI_GATEWAY_API_KEY" ] || [ -n "$VERCEL_AI_GATEWAY_API_KEY" ]; then
            printf 'AVAILABLE\n' > qa-output/v12-essential/provider-preflight.txt
          else
            printf 'MISSING\n' > qa-output/v12-essential/provider-preflight.txt
          fi

      - name: Commit preflight result
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-essential/provider-preflight.txt
          git diff --cached --quiet && exit 0
          git commit -m "record V1.2 provider preflight"
          git push origin HEAD:qa/v12-essential-comparison-20260823
