name: V1.2 Provider Secret Preflight

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/v12-provider-secret-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - name: Record credential availability only
        shell: bash
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          mkdir -p qa-output/v12-essential
          {
            if [ -n "$AI_GATEWAY_API_KEY" ]; then echo 'AI_GATEWAY_API_KEY=AVAILABLE'; else echo 'AI_GATEWAY_API_KEY=MISSING'; fi
            if [ -n "$VERCEL_AI_GATEWAY_API_KEY" ]; then echo 'VERCEL_AI_GATEWAY_API_KEY=AVAILABLE'; else echo 'VERCEL_AI_GATEWAY_API_KEY=MISSING'; fi
            if [ -n "$VERCEL_TOKEN" ]; then echo 'VERCEL_TOKEN=AVAILABLE'; else echo 'VERCEL_TOKEN=MISSING'; fi
            if [ -n "$VERCEL_ACCESS_TOKEN" ]; then echo 'VERCEL_ACCESS_TOKEN=AVAILABLE'; else echo 'VERCEL_ACCESS_TOKEN=MISSING'; fi
            if [ -n "$VERCEL_API_TOKEN" ]; then echo 'VERCEL_API_TOKEN=AVAILABLE'; else echo 'VERCEL_API_TOKEN=MISSING'; fi
          } > qa-output/v12-essential/provider-preflight.txt

      - name: Commit preflight result
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-essential/provider-preflight.txt
          git diff --cached --quiet && exit 0
          git commit -m "record extended V1.2 provider preflight"
          git push origin HEAD:qa/v12-essential-comparison-20260823
