name: Final Acceptance Bootstrap Observer

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: github.event.pull_request.head.ref == 'commercial/mk-fraud-readiness-95-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect latest bootstrap push run
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow final-acceptance-closure-bootstrap.yml --branch commercial/mk-fraud-readiness-95-quality --limit 3 --json databaseId,status,conclusion,headSha,displayTitle,createdAt
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow final-acceptance-closure-bootstrap.yml --branch commercial/mk-fraud-readiness-95-quality --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log
