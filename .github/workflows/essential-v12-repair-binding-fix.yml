name: Essential V1.2 Repair Binding Fix

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/essential-v12-repair-binding-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - name: Bind semantic repair only to candidate adjudicated REPAIR
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/reports/narrative/essential-manuscript-coordinator.ts')
          s = p.read_text()
          old = """  const repairDecision = firstCascade.repairCodes.length > 0\n    ? reviewed?.decisions.find((decision) => decision.disposition === 'REPAIR')\n    : undefined;\n"""
          new = """  // Reviewer repair suggestions may be applied only when the five-layer cascade adjudicated\n  // that exact semantic candidate as REPAIR. A repair code raised by some other deterministic\n  // candidate must never cause an unrelated provider replacement to be applied.\n  const repairCandidateIds = new Set(\n    firstCascade.candidates\n      .filter((candidate) => candidate.finalDisposition === 'REPAIR')\n      .map((candidate) => candidate.id)\n  );\n  const repairDecision = reviewed?.decisions.find(\n    (decision) => decision.disposition === 'REPAIR' && repairCandidateIds.has(decision.candidateId)\n  );\n"""
          if old not in s:
              raise SystemExit('target repair binding not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/narrative/essential-manuscript-coordinator.ts
          git commit -m "bind semantic repair to five-layer candidate decision"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
