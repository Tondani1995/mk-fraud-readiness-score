name: V1.2 Provider Narrative Binding Regression

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/v12-provider-binding-regression.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove provider narrative remains immutable after manuscript acceptance
        run: node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-provider-narrative-binding-tests.mjs
      - name: Re-run existing Essential false-positive safety net
        run: node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Record successful regression proof
        if: success()
        shell: bash
        run: |
          mkdir -p qa-output/v12-provider-binding
          printf '{"ok":true,"runId":"%s","sourceSha":"%s","contract":"accepted-provider-narrative-immutable-through-customer-output-closure"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > qa-output/v12-provider-binding/latest.json
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin qa/v12-essential-five-layer-proof-20260823
          git reset --soft origin/qa/v12-essential-five-layer-proof-20260823
          git add qa-output/v12-provider-binding/latest.json
          git commit -m "record provider narrative binding regression proof"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
