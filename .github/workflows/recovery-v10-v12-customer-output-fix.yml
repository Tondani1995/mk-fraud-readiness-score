name: Apply bounded final Essential customer-output correction

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/recovery-v10-v12-customer-output-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-brand-20260824
          fetch-depth: 0

      - name: Apply customer-visible recovery corrections only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts')
          text = route.read_text()

          old = "const renderPdfOnlyHtml: typeof renderReportHtml = (...args) => stripRetiredRegisterPromise(renderReportHtml(...args));"
          new = r'''function normaliseRecoveryCustomerHtml(html: string): string {
  let cleaned = html;

  // Remove internal trace labels without replacing them with customer-visible placeholders.
  cleaned = cleaned
    .replace(/\s*\((?:D\d+|SCENARIO-\d+)\)/g, '')
    .replace(/\s*\(the relevant control(?:,\s*the relevant control)*\)/gi, '')
    .replace(/\s*\(the relevant roadmap action(?:\s+and\s+the relevant roadmap action)?\)/gi, '');

  // Clean the few grammar remnants created when internal references are removed.
  cleaned = cleaned
    .replace(/Execute the the relevant roadmap action stabilisation item:/gi, 'Execute the priority supplier-onboarding stabilisation action:')
    .replace(/Implement the the relevant roadmap action,\s*the relevant roadmap action and the relevant roadmap action items:/gi, 'Implement the priority 60-day actions:')
    .replace(/the relevant control and the relevant control guide the sequencing and design standard applied to these changes\./gi, 'The agreed sequencing and control standards guide the design of these changes.')
    .replace(/Use authoritative roadmap dependency IDs and escalate threatened prerequisites\./gi, 'Sequence dependent improvements explicitly and escalate any threatened prerequisite.');

  // Do not invent a specific technology stack where the assessment established only a business process.
  cleaned = cleaned.replace(/\bERP activation\b/gi, 'supplier-record activation');

  // Keep risk statements within the evidence actually established by the V1.2 self-assessment.
  cleaned = cleaned
    .replace(/Manual review cannot cover transaction volume,\s*so without data-driven tests the majority of activity is never examined and structured schemes persist undetected\./gi,
      'Partly designed detection can leave material anomalies outside consistent data-driven review, allowing structured schemes to persist without timely challenge.')
    .replace(/manual review cannot cover transaction volume,\s*so without data-driven tests the majority of activity is never examined and structured schemes persist undetected/gi,
      'partly designed detection can leave material anomalies outside consistent data-driven review, allowing structured schemes to persist without timely challenge')
    .replace(/Alert backlogs can conceal important anomalies;\s*unreviewed exceptions can allow losses to compound\./gi,
      'Unreviewed exceptions can leave important anomalies unresolved and allow losses to compound.')
    .replace(/security and personal-data obligations may be breached/gi,
      'security and confidentiality obligations may be breached');

  // These phrases are never valid customer-visible output in the recovered Essential.
  if (/\bSCENARIO-\d+\b|\(D\d+\)|the relevant control|the relevant roadmap action|authoritative roadmap dependency IDs|\bERP activation\b|personal-data obligations may be breached|majority of activity is never examined/i.test(cleaned)) {
    throw new Error('recovery_customer_output_normalisation_incomplete');
  }
  return cleaned;
}

const renderPdfOnlyHtml: typeof renderReportHtml = (...args) =>
  normaliseRecoveryCustomerHtml(stripRetiredRegisterPromise(renderReportHtml(...args)));'''
          if old not in text:
              raise SystemExit('renderPdfOnlyHtml anchor missing')
          route.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -q 'normaliseRecoveryCustomerHtml' src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts
          grep -q 'supplier-record activation' src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts
          grep -q 'security and confidentiality obligations' src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts
          grep -q 'Sequence dependent improvements explicitly' src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Commit bounded customer-output correction
        shell: bash
        run: |
          git config user.name "MK Recovery QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/score/api/qa/recovery-v10-v12-vhutshilo/route.ts
          git commit -m "Fix final Essential customer-visible leakage and unsupported wording"
          git push origin HEAD:recovery/essential-v10-v12-brand-20260824
