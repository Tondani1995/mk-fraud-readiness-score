name: V1 Verification

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  v12-five-layer-semantic-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/v12-essential-comparison-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Apply advisory-to-five-layer correction
        shell: python
        run: |
          from pathlib import Path

          cascade = Path('src/lib/reports/essential-validation-cascade.ts')
          text = cascade.read_text()
          old = """    if (reviewed) {\n      return {\n        disposition: reviewed.disposition === 'ALLOW' ? 'ALLOW_CONTEXT'\n          : reviewed.disposition === 'REPAIR' ? 'REPAIRABLE'\n            : reviewed.disposition === 'REJECT' ? 'CONFIRMED_VIOLATION' : 'AMBIGUOUS',\n        reasonCode: reviewed.reasonCode,\n        repair: reviewed.disposition === 'REPAIR'\n      };\n    }\n"""
          new = """    if (reviewed) {\n      // Semantic review is advisory to the five-layer cascade, never a release verdict by itself.\n      // Deterministic hard gates have already run. Assurance propositions are independently\n      // re-adjudicated through the shared actor/modality/tense/negation/context core so neither a\n      // false REJECT nor an unsafe ALLOW can override the canonical safety decision.\n      const assurance = adjudicateAssuranceSentence(source);\n      if (assurance.disposition === 'CONFIRMED_VIOLATION') {\n        return { disposition: 'CONFIRMED_VIOLATION', reasonCode: assurance.reasonCode, repair: false };\n      }\n      if (reviewed.disposition === 'REPAIR') {\n        return { disposition: 'REPAIRABLE', reasonCode: reviewed.reasonCode, repair: true };\n      }\n      if (reviewed.disposition === 'HOLD') {\n        return { disposition: 'AMBIGUOUS', reasonCode: reviewed.reasonCode, repair: false };\n      }\n      if (reviewed.disposition === 'REJECT') {\n        if (reviewed.reasonCode === 'unsupported_assurance' && assurance.disposition === 'ALLOW_CONTEXT') {\n          return { disposition: 'ALLOW_CONTEXT', reasonCode: `reviewer_adverse_signal_cleared_by_shared_assurance_core:${assurance.reasonCode}`, repair: false };\n        }\n        return { disposition: 'AMBIGUOUS', reasonCode: `semantic_reviewer_adverse_signal_unconfirmed:${reviewed.reasonCode}`, repair: false };\n      }\n      if (assurance.disposition === 'AMBIGUOUS') {\n        return { disposition: 'AMBIGUOUS', reasonCode: assurance.reasonCode, repair: false };\n      }\n      return { disposition: 'ALLOW_CONTEXT', reasonCode: reviewed.reasonCode, repair: false };\n    }\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'semantic_reviewer_adverse_signal_unconfirmed' not in text:
              raise SystemExit('semantic disposition seam missing')
          cascade.write_text(text)

          coordinator = Path('src/lib/reports/narrative/essential-manuscript-coordinator.ts')
          text = coordinator.read_text()
          old_locals = """  const semanticDecisions = reviewed?.decisions ?? [];\n  const rejectedDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REJECT');\n  const heldDecisions = semanticDecisions.filter((decision) => decision.disposition === 'HOLD');\n  const repairDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REPAIR');\n"""
          new_locals = """  const semanticDecisions = reviewed?.decisions ?? [];\n  const repairDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REPAIR');\n"""
          if old_locals in text:
              text = text.replace(old_locals, new_locals, 1)

          old_policy = """  const semanticPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, semanticDecisions);\n  const rejectedPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, rejectedDecisions);\n  const heldPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, heldDecisions);\n  const repairPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, repairDecisions);\n"""
          new_policy = """  const semanticPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, semanticDecisions);\n  const repairPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, repairDecisions);\n"""
          if old_policy in text:
              text = text.replace(old_policy, new_policy, 1)

          early = """  if (rejectedDecisions.length > 0) {\n    throw new EssentialManuscriptError(\n      'semantic_review',\n      'The semantic reviewer rejected one or more provider-authored narrative blocks.',\n      {\n        ...semanticPolicyBase,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        validationCode: 'semantic_reject',\n        validationIssues: semanticPolicyValidationIssues(rejectedPolicyDecisions, 'A provider-authored narrative block was rejected by semantic grounding review.')\n      }\n    );\n  }\n  if (heldDecisions.length > 0) {\n    throw new EssentialManuscriptError(\n      'semantic_review',\n      'The semantic reviewer held one or more provider-authored narrative blocks for review.',\n      {\n        ...semanticPolicyBase,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        validationCode: 'semantic_hold',\n        validationIssues: semanticPolicyValidationIssues(heldPolicyDecisions, 'A provider-authored narrative block was held by semantic grounding review.')\n      }\n    );\n  }\n"""
          replacement = """  // REJECT and HOLD are reviewer recommendations, not release verdicts. They proceed into the\n  // canonical five-layer cascade, which alone may ACCEPT, REPAIR, HOLD or confirm REJECT.\n"""
          if early in text:
              text = text.replace(early, replacement, 1)
          elif 'REJECT and HOLD are reviewer recommendations' not in text:
              raise SystemExit('early semantic veto seam missing')

          old_diag = """        validationCode: failure.codes[0],\n        validationIssues: failure.validationIssues\n"""
          new_diag = """        validationCode: failure.codes[0],\n        validationIssues: failure.validationIssues,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        ...(semanticPolicyDecisions.length > 0 ? { semanticPolicyDecisions } : {})\n"""
          if old_diag in text:
              text = text.replace(old_diag, new_diag, 1)
          coordinator.write_text(text)

          test = Path('scripts/commercial-quality/essential-validation-cascade-regression.mjs')
          suite = test.read_text()
          if 'essentialCandidateId,' not in suite:
              suite = suite.replace("  adjudicateTextFirstValidation,\n  validateEssentialFinalHtml\n", "  adjudicateTextFirstValidation,\n  essentialCandidateId,\n  validateEssentialFinalHtml\n", 1)
          marker = "test('hard evidence and contract failures cannot be context-cleared', () => {\n"
          additions = r"""test('semantic reviewer REJECT is advisory and safe customer assurance language is cleared by five layers', () => {
  const text = 'Management should obtain independent review of refund and override activity before closure.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'REJECT', reasonCode: 'unsupported_assurance' }] });
  assert.equal(result.publishable, true);
  assert.equal(result.candidates[0].finalDisposition, 'ACCEPT');
});

test('semantic reviewer ALLOW cannot waive a genuine assurance violation', () => {
  const text = 'This report provides independent assurance that the controls are effective.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'ALLOW', reasonCode: 'grounded' }] });
  assert.equal(result.publishable, false);
  assert.equal(result.candidates[0].finalDisposition, 'REJECT');
});

test('unconfirmed non-assurance semantic REJECT becomes HOLD rather than false confirmed rejection', () => {
  const text = 'The finance team performs daily exception reviews across all sites.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'REJECT', reasonCode: 'unsupported_frequency' }] });
  assert.equal(result.publishable, false);
  assert.equal(result.candidates[0].finalDisposition, 'HELD_FOR_REVIEW');
  assert.equal(result.blockingCodes.length, 0);
});

"""
          if 'semantic reviewer REJECT is advisory and safe customer assurance language' not in suite:
              if marker not in suite: raise SystemExit('test seam missing')
              suite = suite.replace(marker, additions + marker, 1)
          test.write_text(suite)

          route = Path('src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts')
          r = route.read_text()
          if "diagnosticRevision:'semantic-audit-v1'" in r:
              r = r.replace("diagnosticRevision:'semantic-audit-v1'", "diagnosticRevision:'semantic-advisory-v1'", 1)
          route.write_text(r)

      - name: Prove bounded safety contract
        shell: bash
        run: |
          NODE_TEST="node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs"
          $NODE_TEST scripts/commercial-quality/essential-validation-cascade-regression.mjs
          $NODE_TEST scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          $NODE_TEST scripts/commercial-quality/narrative-assurance-semantics-tests.mjs
          npm run typecheck
          git diff --check

      - name: Commit proven QA source correction
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/essential-validation-cascade.ts src/lib/reports/narrative/essential-manuscript-coordinator.ts scripts/commercial-quality/essential-validation-cascade-regression.mjs 'src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "route semantic review through five-layer adjudication"
          git push origin HEAD:qa/v12-essential-comparison-20260823

  v1-verification:
    name: V1 verification checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      ASSESSMENT_TOKEN_PEPPER: ci-token-pepper
      ASSESSMENT_RESUME_TOKEN_TTL_HOURS: '336'
      ASSESSMENT_SNAPSHOT_TOKEN_TTL_HOURS: '168'
      ASSESSMENT_REPORT_REQUEST_TOKEN_TTL_HOURS: '168'
      ASSESSMENT_TOKEN_MAX_USES: '25'
      ASSESSMENT_SNAPSHOT_TOKEN_MAX_USES: '100'
      MK_BUILD_PHASE: phase-14-autonomous-premium-report-engine
      MK_RELEASE_CHANNEL: ci
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify seven accepted migration payload checksums
        run: npm run rc1:verify-accepted-migrations

      - name: Verify RC1 near-real-time automatic fulfilment
        run: npm run rc1:test-near-real-time-fulfilment

      - name: Verify RC1 synthetic notification contract
        run: npm run rc1:test-synthetic-notification-contract

      - name: Verify AST-derived service-role privilege contract
        run: npm run rc1:analyze-service-role-contract

      - name: Run Phase 7 snapshot tests
        run: npm run phase7:test-snapshot

      - name: Run Phase 8 admin console tests
        run: npm run phase8:test-admin

      - name: Run Phase 1 capability diagnostics tests
        run: npm run phase1:test-capability-diagnostics

      - name: Run methodology copy polish tests
        run: npm run methodology:copy-test

      - name: Run Phase 9 manual EFT order tests
        run: npm run phase9:test-orders

      - name: Run Phase 10 premium report tests
        run: npm run phase10:test-report

      - name: Run Phase 11 security QA tests
        run: npm run phase11:test-security

      - name: Run Phase 13 commercial event tests
        run: npm run phase13:test-events

      - name: Run Phase 13 conversion tests
        run: npm run phase13:test-conversion

      - name: Run Phase 14 autonomous report engine tests
        run: npm run phase14:test-report-engine

      - name: Run Phase 14 PDF email delivery tests
        run: npm run phase14:test-email-delivery

      - name: Run Phase 14 security closure tests
        run: npm run phase14:test-security-closure

      - name: Run Phase 14 isolated storage fault-injection tests
        run: npm run phase14:test-storage-faults

      - name: Run Phase 14 isolated provider fault-injection tests
        run: npm run phase14:test-provider-faults

      - name: Run Phase 14 webhook adversarial helper tests
        run: npm run phase14:test-webhook-adversarial

      - name: Run Phase 14 AI fingerprint and accounting tests
        run: npm run phase14:test-ai-accounting

      - name: Render a real PDF under Node 24 Chromium
        run: npm run phase14:test-node24-pdf

      - name: Upload Node 24 PDF smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-node24-chromium-smoke
          path: tmp/phase14-node24-chromium-smoke.pdf
          if-no-files-found: error

      - name: Run platform hardening tests
        run: npm run platform:test-hardening

      - name: Verify consolidated route ownership
        run: npm run consolidation:test-routes

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build