name: V1 Verification

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  focused-comprehensive-propagation:
    if: github.event_name == 'pull_request' && github.head_ref == 'hotfix/comprehensive-manuscript-production-propagation-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-manuscript-production-propagation-20260904
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Keep only approved Comprehensive engine changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase7-verification.yml .gitleaksignore package-lock.json scripts/rc1-service-role-privilege-contract-analysis.mjs

          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one target, found ${count}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'src/lib/reports/narrative/blueprint-text.ts',
            `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Scale denominators and neutral counters are structural constants, not\n  // customer claims. All other numbers must come from the paragraph's bound\n  // Fact Pack references.\n  const values = new Set<string>(['0', '1', '100']);\n  const permitted = new Set(permittedClaimRefs);`,
            `function scopedNumericValues(pack: NarrativeFactPack, permittedClaimRefs: string[]): Set<string> {\n  // Essential keeps its certified whole-Fact-Pack numeric grounding behaviour.\n  // Comprehensive uses the paragraph-scoped provenance contract below.\n  const values = new Set<string>(['0', '1', '100']);\n  if (pack.productTier === 'essential') {\n    for (const match of JSON.stringify(pack).matchAll(/\\b\\d+(?:\\.\\d+)?%?\\b/g)) values.add(match[0].replace('%', ''));\n    return values;\n  }\n  const permitted = new Set(permittedClaimRefs);`
          );

          replaceOnce(
            'src/lib/comprehensive/synthetic-fixture-generation.ts',
            `    const rendered = await renderComprehensiveReportPdf({\n      assembled,\n      evidenceModel: advisoryModel,\n      maxRepairsPerSlot: 0\n    });`,
            `    const rendered = await renderComprehensiveReportPdf({\n      assembled,\n      evidenceModel: advisoryModel\n    });`
          );
          NODE

          rm -f .github/workflows/temp-pr63-bounded-reconciliation.yml

      - name: Verify Essential compatibility
        run: npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Verify patch
        run: git diff --check

      - name: Commit focused engine propagation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MK Comprehensive Propagation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(comprehensive): attach approved manuscript-first engine only"
          git push origin HEAD:hotfix/comprehensive-manuscript-production-propagation-20260904

  v1-verification:
    name: V1 verification checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      ASSESSMENT_TOKEN_PEPPER: ci-token-pepper
      ASSESSMENT_RESUME_TOKEN_TTL_HOURS: '336'
      ASSESSMENT_SNAPSHOT_TOKEN_TTL_HOURS: '168'
      ASSESSMENT_REPORT_REQUEST_TOKEN_TTL_HOURS: '168'
      ASSESSMENT_TOKEN_MAX_USES: '25'
      ASSESSMENT_SNAPSHOT_TOKEN_MAX_USES: '100'
      MK_BUILD_PHASE: phase-14-autonomous-premium-report-engine
      MK_RELEASE_CHANNEL: ci
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify seven accepted migration payload checksums
        run: npm run rc1:verify-accepted-migrations

      - name: Verify V1.2 manual commercial fulfilment contract
        run: npm run v12:test-manual-fulfilment

      - name: Verify RC1 synthetic notification contract
        run: npm run rc1:test-synthetic-notification-contract

      - name: Verify AST-derived service-role privilege contract
        run: npm run rc1:analyze-service-role-contract

      - name: Run Phase 7 snapshot tests
        run: npm run phase7:test-snapshot

      - name: Run Phase 8 admin console tests
        run: npm run phase8:test-admin

      - name: Run Phase 1 capability diagnostics tests
        run: npm run phase1:test-capability-diagnostics

      - name: Run methodology copy polish tests
        run: npm run methodology:copy-test

      - name: Run Phase 9 manual EFT order tests
        run: npm run phase9:test-orders

      - name: Run Phase 10 premium report tests
        run: npm run phase10:test-report

      - name: Run Phase 11 security QA tests
        run: npm run phase11:test-security

      - name: Run Phase 13 commercial event tests
        run: npm run phase13:test-events

      - name: Run Phase 13 conversion tests
        run: npm run phase13:test-conversion

      - name: Run Phase 14 autonomous report engine tests
        run: npm run phase14:test-report-engine

      - name: Run Phase 14 PDF email delivery tests
        run: npm run phase14:test-email-delivery

      - name: Run Phase 14 security closure tests
        run: npm run phase14:test-security-closure

      - name: Run Phase 14 isolated storage fault-injection tests
        run: npm run phase14:test-storage-faults

      - name: Run Phase 14 isolated provider fault-injection tests
        run: npm run phase14:test-provider-faults

      - name: Run Phase 14 webhook adversarial helper tests
        run: npm run phase14:test-webhook-adversarial

      - name: Run Phase 14 AI fingerprint and accounting tests
        run: npm run phase14:test-ai-accounting

      - name: Render a real PDF under Node 24 Chromium
        run: npm run phase14:test-node24-pdf

      - name: Upload Node 24 PDF smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-node24-chromium-smoke
          path: tmp/phase14-node24-chromium-smoke.pdf
          if-no-files-found: error

      - name: Run platform hardening tests
        run: npm run platform:test-hardening

      - name: Verify consolidated route ownership
        run: npm run consolidation:test-routes

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build
