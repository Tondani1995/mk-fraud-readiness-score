name: Essential V1.2 Exact Individual Capture

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/essential-v12-exact-capture-individual.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PREVIEW_URL: https://mk-fraud-platform-cbz0nevjk-tondanis-projects.vercel.app
      SOURCE_DEPLOYMENT: dpl_C6tBFLmu2PjUXpFLykkgR8aCuLD1
      SOURCE_SHA: 8779a6ae9a679536f34261ef4327c8f06ca8d511
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0

      - name: Verify exact V1.2 source and five-layer safety
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_PROTECTION_BYPASS"
          mkdir -p qa-output/v12-exact-individual-8779a6a
          safety=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-safety-proof")
          printf '%s\n' "$safety" > qa-output/v12-exact-individual-8779a6a/safety.json
          printf '%s' "$safety" | grep -Fq '"ok":true'
          printf '%s' "$safety" | grep -Fq '"policy":"semantic-review-advisory-to-five-layer-cascade"'
          meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/bokamoso?format=meta")
          printf '%s' "$meta" | grep -Fq '"graphVersion":"MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821"'
          node -e "require('fs').writeFileSync('qa-output/v12-exact-individual-8779a6a/source.json', JSON.stringify({sourceDeployment:process.env.SOURCE_DEPLOYMENT,sourceSha:process.env.SOURCE_SHA,previewUrl:process.env.PREVIEW_URL,graphVersion:'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821'},null,2)+'\n')"

      - name: Capture one bounded attempt per profile
        shell: bash
        run: |
          set -u
          out=qa-output/v12-exact-individual-8779a6a
          for profile in bokamoso siyakhula vhutshilo; do
            case "$profile" in
              bokamoso) name='Bokamoso_Skills_Institute_Essential_V1_2.pdf' ;;
              siyakhula) name='Siyakhula_Community_Foundation_Essential_V1_2.pdf' ;;
              vhutshilo) name='Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' ;;
            esac
            meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile?format=meta")
            printf '%s\n' "$meta" > "$out/${profile}-meta.json"
            code=$(curl -sS -w '%{http_code}' -D "$out/${profile}-headers.txt" -o "$out/${profile}-response.bin" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile")
            printf '%s\n' "$code" > "$out/${profile}-http-code.txt"
            if [ "$code" = "200" ] && head -c 4 "$out/${profile}-response.bin" | grep -q '%PDF'; then
              mv "$out/${profile}-response.bin" "$out/$name"
              sha256sum "$out/$name" > "$out/${profile}-sha256.txt"
              echo "$profile SUCCESS"
            else
              mv "$out/${profile}-response.bin" "$out/${profile}-diagnostic.json"
              echo "$profile HELD/FAILED HTTP $code"
            fi
          done

      - name: Commit capture evidence
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-exact-individual-8779a6a
          git commit -m "capture exact V1.2 individual reports from 8779a6a" || true
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823

      - name: Upload capture package
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-exact-individual-8779a6a
          path: qa-output/v12-exact-individual-8779a6a/*
          if-no-files-found: error
          retention-days: 30
