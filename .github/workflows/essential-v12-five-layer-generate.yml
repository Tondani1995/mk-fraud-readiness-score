name: Essential V1.2 Three-Report Five-Layer Proof

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/essential-v12-five-layer-generate.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PREVIEW_URL: https://mk-fraud-platform-git-qa-v12-essential-577a04-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823

      - name: Require protected-preview bypass
        shell: bash
        run: |
          test -n "$VERCEL_PROTECTION_BYPASS" || { echo "VERCEL_PROTECTION_BYPASS missing"; exit 1; }

      - name: Wait for corrected five-layer deployment
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            safety=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-safety-proof" 2>/dev/null || true)
            meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/bokamoso?format=meta" 2>/dev/null || true)
            if printf '%s' "$safety" | grep -Fq '"ok":true' && printf '%s' "$meta" | grep -Fq '"graphVersion":"MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821"'; then
              printf '%s\n' "$safety"
              printf '%s\n' "$meta"
              ready=1
              break
            fi
            echo "waiting for corrected V1.2 preview ($attempt/60)"
            sleep 5
          done
          test "$ready" -eq 1 || { echo "Corrected preview did not become ready"; exit 1; }

      - name: Generate three Essential V1.2 reports through real Mini path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v12-reports
          printf '[\n' > v12-reports/summary.json
          first=1
          for profile in bokamoso siyakhula vhutshilo; do
            echo "Generating $profile..."
            meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile?format=meta")
            printf '%s\n' "$meta" > "v12-reports/${profile}-meta.json"
            code=$(curl -sS -w '%{http_code}' -D "v12-reports/${profile}-headers.txt" -o "v12-reports/${profile}.bin" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile")
            if [ "$code" != "200" ]; then
              echo "Generation failed for $profile with HTTP $code"
              cat "v12-reports/${profile}.bin"
              exit 1
            fi
            content_type=$(grep -i '^content-type:' "v12-reports/${profile}-headers.txt" | tr -d '\r' | tail -1)
            printf '%s' "$content_type" | grep -qi 'application/pdf' || { echo "Unexpected content type: $content_type"; exit 1; }
            head -c 4 "v12-reports/${profile}.bin" | grep -q '%PDF' || { echo "Invalid PDF for $profile"; exit 1; }
            case "$profile" in
              bokamoso) name='Bokamoso_Skills_Institute_Essential_V1_2.pdf' ;;
              siyakhula) name='Siyakhula_Community_Foundation_Essential_V1_2.pdf' ;;
              vhutshilo) name='Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' ;;
            esac
            mv "v12-reports/${profile}.bin" "v12-reports/$name"
            sha=$(sha256sum "v12-reports/$name" | awk '{print $1}')
            bytes=$(wc -c < "v12-reports/$name" | tr -d ' ')
            score=$(node -e "const m=JSON.parse(require('fs').readFileSync('v12-reports/${profile}-meta.json')); process.stdout.write(String(m.score))")
            maturity=$(node -e "const m=JSON.parse(require('fs').readFileSync('v12-reports/${profile}-meta.json')); process.stdout.write(String(m.finalMaturity))")
            if [ "$first" -eq 0 ]; then printf ',\n' >> v12-reports/summary.json; fi
            first=0
            node -e "process.stdout.write(JSON.stringify({profile:process.argv[1],file:process.argv[2],score:Number(process.argv[3]),maturity:process.argv[4],bytes:Number(process.argv[5]),sha256:process.argv[6]}))" "$profile" "$name" "$score" "$maturity" "$bytes" "$sha" >> v12-reports/summary.json
            echo "$profile PASS score=$score maturity=$maturity bytes=$bytes sha=$sha"
          done
          printf '\n]\n' >> v12-reports/summary.json
          cat v12-reports/summary.json

      - name: Upload three V1.2 reports
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-three-report-five-layer-proof
          path: v12-reports/*
          if-no-files-found: error
          retention-days: 14
