name: Comprehensive V1.2 One-Call Live Proof

# Owner-authorised one-off engineering proof only. This workflow does not
# participate in fulfilment, deploy Comprehensive, or touch Supabase.
on:
  push:
    branches:
      - work/comprehensive-report-quality-20260901
    paths:
      - scripts/commercial-quality/comprehensive-v12-live-interpretation-proof.mjs
      - .github/workflows/comprehensive-v12-one-call-live-proof.yml

permissions:
  contents: read

jobs:
  one-call-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
      LIVE_OUTPUT_DIR: outputs/comprehensive-v12-live-proof
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify live-proof credential exists
        shell: bash
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ] && [ -z "$VERCEL_AI_GATEWAY_API_KEY" ] && [ -z "$VERCEL_OIDC_TOKEN" ]; then
            echo "No AI Gateway credential is available in GitHub Actions. No provider call was made." >&2
            exit 1
          fi
          echo "Credential presence confirmed; value remains masked."

      - name: Re-prove deterministic V1.2 Comprehensive engine before spend
        env:
          CERT_OUTPUT_DIR: outputs/comprehensive-v12-engine-preflight
        run: >
          node
          --experimental-strip-types
          --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs
          scripts/commercial-quality/comprehensive-v12-engine-quality-gate.mjs

      - name: Execute exactly one Luna interpretation call with zero repairs
        run: >
          node
          --experimental-strip-types
          --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs
          scripts/commercial-quality/comprehensive-v12-live-interpretation-proof.mjs

      - name: Upload live-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-v12-one-call-live-proof
          path: outputs/comprehensive-v12-live-proof
          if-no-files-found: warn
          retention-days: 30
