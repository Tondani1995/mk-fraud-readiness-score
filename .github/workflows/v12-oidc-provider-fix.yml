name: V1.2 Vercel OIDC Provider Fix

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/v12-oidc-provider-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - name: Apply narrow V1.2 assurance false-positive correction
        shell: python
        run: |
          from pathlib import Path

          core = Path('src/lib/reports/narrative/assurance-adjudication.ts')
          text = core.read_text()
          anchor = "const CONTROL_DESIGN_INDEPENDENT_REVIEW = /(?:\\b(?:separation|segregation|oversight|challenge|route|function|responsibilit(?:y|ies)|role|approval)\\b[^.!?]{0,180}\\bindependent review\\b|\\bindependent review\\b[^.!?]{0,180}\\b(?:role|function|responsibilit(?:y|ies)|route|requirement|separation|oversight|challenge)\\b)/i;"
          addition = anchor + "\n// V1.2 Bokamoso runtime incident (2026-08-23): deterministic customer control wording such as\n// refunds/credits/overrides receiving independent review and cash counts performed with independent\n// review is a control requirement, not a claim that MK/the report performed assurance. Tier E actor\n// checks run first, so report/MK-as-verifier claims remain rejected before this narrow allow rule.\nconst CUSTOMER_CONTROL_REVIEW_ACTIVITY = /\\b(?:refunds?|credits?|write-?offs?|stock adjustments?|manual journals?|overrides?|cash|cash custodians?|counts?|reconciliations?|bankings?|payments?|supplier|bank[- ]detail|profile|access|recertification|activation|changes?|approvals?|exceptions?|reported concerns?|cases?)\\b[^.!?]{0,220}\\bindependent review\\b/i;"
          if 'const CUSTOMER_CONTROL_REVIEW_ACTIVITY' not in text:
              if anchor not in text:
                  raise SystemExit('CONTROL_DESIGN_INDEPENDENT_REVIEW anchor missing; refusing broad rewrite.')
              text = text.replace(anchor, addition, 1)

          list_anchor = "    CONTROL_DESIGN_INDEPENDENT_REVIEW,\n    DIRECT_CONTROL_ACTIVITY,"
          list_replacement = "    CONTROL_DESIGN_INDEPENDENT_REVIEW,\n    CUSTOMER_CONTROL_REVIEW_ACTIVITY,\n    DIRECT_CONTROL_ACTIVITY,"
          if '    CUSTOMER_CONTROL_REVIEW_ACTIVITY,' not in text:
              if list_anchor not in text:
                  raise SystemExit('Tier F allow-list anchor missing; refusing broad rewrite.')
              text = text.replace(list_anchor, list_replacement, 1)
          core.write_text(text)

          test = Path('scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs')
          suite = test.read_text()
          marker = "  'The report guides the organisation toward independent verification of operating effectiveness.'\n];"
          replacement = "  'The report guides the organisation toward independent verification of operating effectiveness.',\n  'Close the material control weakness recorded for \\\"Refunds, credits, write-offs, stock adjustments, manual journals and overrides receive independent review where used\\\".',\n  'Finance and site managers must assign cash custodians, perform opening and closing counts with independent review, reconcile takings to receipts and bankings, record sealed transfers and investigate every shortage or overage against a defined threshold before the next cycle closes.'\n];"
          if 'Close the material control weakness recorded for' not in suite:
              if marker not in suite:
                  raise SystemExit('MUST_ALLOW marker missing; refusing broad test rewrite.')
              suite = suite.replace(marker, replacement, 1)
          test.write_text(suite)

      - name: Run bounded assurance regressions
        shell: bash
        run: |
          node --test scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          node --test scripts/commercial-quality/narrative-assurance-semantics-tests.mjs
          node --test scripts/commercial-quality/essential-validation-cascade-regression.mjs
          git diff --check

      - name: Commit proven narrow fix
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/narrative/assurance-adjudication.ts scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          git diff --cached --quiet && exit 0
          git commit -m "allow deterministic customer control review language"
          git push origin HEAD:qa/v12-essential-comparison-20260823
