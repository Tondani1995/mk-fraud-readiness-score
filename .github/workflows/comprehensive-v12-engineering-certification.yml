name: Comprehensive V1.2 Engineering Certification

on:
  push:
    branches:
      - work/comprehensive-report-quality-20260901
    paths:
      - src/lib/reports/comprehensive/**
      - src/lib/reports/narrative/**
      - src/lib/reports/design/**
      - src/lib/reports/render-pdf.ts
      - src/lib/qa/comprehensive-v12-quality-profiles.ts
      - scripts/commercial-quality/comprehensive-v12-**
      - scripts/commercial-quality/comprehensive-v12-narrative-architecture-gate.mjs
      - scripts/commercial-quality/comprehensive-recovery-routing-gate.mjs
      - scripts/commercial-quality/comprehensive-recovery-behaviour-tests.mjs
      - scripts/commercial-quality/comprehensive-brand-regression.mjs
      - scripts/commercial-quality/comprehensive-current-path-acceptance-gate.mjs
      - scripts/commercial-quality/comprehensive-current-layout-composition-gate.mjs
      - scripts/commercial-quality/comprehensive-customer-copy-leakage-gate.mjs
      - scripts/commercial-quality/comprehensive-motheo-terra-fixture.md
      - scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs
      - scripts/commercial-quality/customer-specific-logic-gate.mjs
      - package.json
      - .github/workflows/comprehensive-v12-engineering-certification.yml
  pull_request:
    branches:
      - main
    paths:
      - src/lib/reports/comprehensive/**
      - src/lib/reports/narrative/**
      - src/lib/reports/design/**
      - src/lib/reports/render-pdf.ts
      - src/lib/qa/comprehensive-v12-quality-profiles.ts
      - scripts/commercial-quality/comprehensive-v12-**
      - scripts/commercial-quality/comprehensive-v12-narrative-architecture-gate.mjs
      - scripts/commercial-quality/comprehensive-recovery-routing-gate.mjs
      - scripts/commercial-quality/comprehensive-recovery-behaviour-tests.mjs
      - scripts/commercial-quality/comprehensive-brand-regression.mjs
      - scripts/commercial-quality/comprehensive-current-path-acceptance-gate.mjs
      - scripts/commercial-quality/comprehensive-current-layout-composition-gate.mjs
      - scripts/commercial-quality/comprehensive-customer-copy-leakage-gate.mjs
      - scripts/commercial-quality/comprehensive-motheo-terra-fixture.md
      - scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs
      - scripts/commercial-quality/customer-specific-logic-gate.mjs
      - package.json
      - .github/workflows/comprehensive-v12-engineering-certification.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This certification is deliberately provider-free.
      AI_GATEWAY_API_KEY: ''
      VERCEL_AI_GATEWAY_API_KEY: ''
      VERCEL_OIDC_TOKEN: ''
      CERT_OUTPUT_DIR: outputs/comprehensive-v12-engineering-certification
      PDF_OUTPUT_DIR: outputs/comprehensive-v12-engineering-certification/pdf
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF inspection tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Diff hygiene
        run: |
          git diff --check origin/main...HEAD

      - name: Prove frozen Comprehensive commercial and assurance contract
        run: npm run v11:comprehensive-contract-gate

      - name: Prove no customer-specific report logic
        run: npm run v11:customer-specific-logic-gate

      - name: Prove customer-visible adaptation boundary
        run: >
          node
          --experimental-strip-types
          --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs
          --test
          scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs

      - name: Prove tier routing uses bounded Comprehensive recovery
        run: node scripts/commercial-quality/comprehensive-recovery-routing-gate.mjs

      - name: Prove manuscript-first Comprehensive customer architecture
        run: >
          node
          --experimental-strip-types
          --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs
          scripts/commercial-quality/comprehensive-v12-narrative-architecture-gate.mjs

      - name: Prove bounded Comprehensive recovery behavior
        run: npm run v11:comprehensive-recovery-behaviour

      - name: Prove Essential-authority MK branding parity
        run: npm run v11:comprehensive-brand-regression

      - name: Render provider-free current A-F owner-review PDFs
        env:
          CURRENT_COMPREHENSIVE_OUTPUT_DIR: outputs/comprehensive-v12-engineering-certification/current-path
        run: npm run v11:comprehensive-current-path

      - name: Reject customer-copy report-engine leakage
        env:
          CURRENT_COMPREHENSIVE_OUTPUT_DIR: outputs/comprehensive-v12-engineering-certification/current-path
        run: npm run v11:comprehensive-customer-copy-leakage

      - name: Reject orphaned and underfilled PDF composition
        env:
          CURRENT_COMPREHENSIVE_OUTPUT_DIR: outputs/comprehensive-v12-engineering-certification/current-path
        run: npm run v11:comprehensive-current-layout

      - name: Prove temporary paid-call surfaces are closed
        run: |
          test ! -e src/app/score/api/qa/comprehensive-v12-one-call-proof/route.ts
          test ! -e .github/workflows/comprehensive-v12-one-call-live-proof.yml
          test ! -e scripts/commercial-quality/comprehensive-v12-live-interpretation-proof.mjs
          test ! -e src/app/score/api/qa/comprehensive-v12-recovery-proof/route.ts
          test ! -e src/app/score/api/qa/comprehensive-v12-owner-review-pdf/route.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-v12-engineering-certification
          path: outputs/comprehensive-v12-engineering-certification
          if-no-files-found: warn
          retention-days: 30
