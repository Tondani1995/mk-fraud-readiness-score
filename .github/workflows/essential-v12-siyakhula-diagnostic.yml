name: Essential V1.2 Siyakhula Semantic Diagnostic

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/essential-v12-siyakhula-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://mk-fraud-platform-git-qa-v12-essential-577a04-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0

      - name: Require corrected safety proof and V1.2 metadata
        shell: bash
        run: |
          test -n "$VERCEL_PROTECTION_BYPASS"
          safety=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-safety-proof")
          printf '%s' "$safety" | grep -Fq '"ok":true'
          meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/siyakhula?format=meta")
          printf '%s' "$meta" | grep -Fq '"graphVersion":"MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821"'
          mkdir -p qa-output/v12-essential-five-layer
          printf '%s\n' "$meta" > qa-output/v12-essential-five-layer/siyakhula-meta.json

      - name: Run Siyakhula exactly once and capture full response
        id: call
        shell: bash
        run: |
          set +e
          code=$(curl -sS -w '%{http_code}' -D qa-output/v12-essential-five-layer/siyakhula-headers.txt -o qa-output/v12-essential-five-layer/siyakhula-response.bin -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/siyakhula")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            cp qa-output/v12-essential-five-layer/siyakhula-response.bin qa-output/v12-essential-five-layer/Siyakhula_Community_Foundation_Essential_V1_2.pdf
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            mv qa-output/v12-essential-five-layer/siyakhula-response.bin qa-output/v12-essential-five-layer/siyakhula-diagnostic.json
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat qa-output/v12-essential-five-layer/siyakhula-diagnostic.json
          fi
          exit 0

      - name: Commit exact diagnostic pointer
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const dir='qa-output/v12-essential-five-layer';
          const result={runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,httpCode:'${{ steps.call.outputs.http_code }}',success:'${{ steps.call.outputs.success }}'==='true',capturedAt:new Date().toISOString()};
          fs.writeFileSync(`${dir}/siyakhula-latest-run.json`,JSON.stringify(result,null,2)+'\n');
          NODE
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin qa/v12-essential-five-layer-proof-20260823
          git reset --soft origin/qa/v12-essential-five-layer-proof-20260823
          git add qa-output/v12-essential-five-layer
          git commit -m "record exact Siyakhula V1.2 semantic diagnostic"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-siyakhula-diagnostic
          path: qa-output/v12-essential-five-layer/*
          retention-days: 14
