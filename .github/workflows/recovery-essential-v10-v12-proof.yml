name: Recovery Essential V10 + V1.2 Provider-Free Proof

on:
  push:
    branches:
      - recovery/essential-v10-v12-minimal-20260824

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-minimal-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck recovered V10 + V1.2 engine
        run: npm run typecheck
      - name: Prove frozen Vhutshilo V1.2 truth and deterministic report compatibility
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/recovery/v12-vhutshilo-score-proof.mjs | tee /tmp/vhutshilo-proof.json
      - name: Prove V10 report regressions still hold
        run: |
          npx tsx --test scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs
          npx tsx --test scripts/commercial-quality/essential-v9-second-opinion-regression.mjs
      - name: Persist successful provider-free proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/recovery
          cp /tmp/vhutshilo-proof.json scripts/recovery/v12-vhutshilo-proof-status.json
          printf 'source_sha=%s\nrun_id=%s\nstatus=PASS\nprovider_calls=0\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > scripts/recovery/.v12-vhutshilo-proof-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/recovery/v12-vhutshilo-proof-status.json scripts/recovery/.v12-vhutshilo-proof-status
          git commit -m "Record recovery provider-free proof"
          git pull --rebase origin recovery/essential-v10-v12-minimal-20260824
          git push origin HEAD:recovery/essential-v10-v12-minimal-20260824
