name: Recovery Essential V10 + V1.2 Provider-Free Proof

on:
  push:
    branches:
      - recovery/essential-v10-v12-minimal-20260824

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-minimal-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Apply only the two proven V1.2 recovery compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          playbooks_path = Path('src/lib/reports/evidence-model/question-playbooks.ts')
          text = playbooks_path.read_text()
          old_id = "export const MFRS_V12_METHODOLOGY_ID = 'c9c40448-8035-4bcc-9804-d5b08a604289';"
          new_id = """export const MFRS_V12_METHODOLOGY_ID = 'c9c40448-8035-4bcc-9804-d5b08a604289';
// The frozen V1.2 QA fixture was assembled against the candidate methodology row used by the
// comparison route. Both UUIDs identify the same owner-corrected V1.2 instrument; accepting the
// second UUID here is compatibility only and does not alter scoring or question semantics.
const MFRS_V12_COMPATIBILITY_METHODOLOGY_IDS = new Set([
  MFRS_V12_METHODOLOGY_ID,
  '00f2b435-a027-4a06-886b-23998faeaca6'
]);
function isV12Methodology(methodologyVersionId?: string): boolean {
  return Boolean(methodologyVersionId && MFRS_V12_COMPATIBILITY_METHODOLOGY_IDS.has(methodologyVersionId));
}"""
          text = replace_once(text, old_id, new_id, 'V1.2 methodology compatibility identity')
          text = replace_once(
              text,
              "  if (methodologyVersionId !== MFRS_V12_METHODOLOGY_ID) return PLAYBOOKS;",
              "  if (!isV12Methodology(methodologyVersionId)) return PLAYBOOKS;",
              'V1.2 playbook registry selection'
          )
          text = replace_once(
              text,
              "  if (methodologyVersionId === MFRS_V12_METHODOLOGY_ID && V12_NON_ACTIVE_QUESTION_CODES.has(questionCode)) return null;",
              "  if (isV12Methodology(methodologyVersionId) && V12_NON_ACTIVE_QUESTION_CODES.has(questionCode)) return null;",
              'V1.2 inactive mapping selection'
          )
          text = replace_once(
              text,
              "  return methodologyVersionId === MFRS_V12_METHODOLOGY_ID\n    ? V12_AUTHORITATIVE_QUESTION_MAPPINGS[questionCode] ?? AUTHORITATIVE_QUESTION_MAPPINGS[questionCode] ?? null",
              "  return isV12Methodology(methodologyVersionId)\n    ? V12_AUTHORITATIVE_QUESTION_MAPPINGS[questionCode] ?? AUTHORITATIVE_QUESTION_MAPPINGS[questionCode] ?? null",
              'V1.2 authoritative mapping selection'
          )
          playbooks_path.write_text(text)

          template_path = Path('src/lib/reports/templates/report-template.ts')
          text = template_path.read_text()
          text = replace_once(
              text,
              "import type { ParsedBlueprintMarkdown } from '../narrative/blueprint-text';",
              "import type { ParsedBlueprintMarkdown } from '../narrative/blueprint-text';\nimport { groundEssentialScenarioStateLanguage } from '../essential-presentation-adaptation';",
              'scenario grounding import'
          )
          anchor = """  // The accepted v1.1 manuscript is interpretation around deterministic exhibits, not a second
  // report appended after methodology. Bind each chapter to the section it was written to explain.
  const narrativeChapterBody = (
"""
          replacement = """  // The accepted v1.1 manuscript is interpretation around deterministic exhibits, not a second
  // report appended after methodology. Bind each chapter to the section it was written to explain.
  // Preserve V10's bounded scenario-state grounding so one maturity label can never be applied to
  // several different controls inside the scenario chapter.
  const narrativeBlockText = (chapterId: string, value: string): string =>
    chapterId === 'EXPOSURE-COULD-MATERIALISE'
      ? groundEssentialScenarioStateLanguage(value, evidenceModel.materialFindings)
      : value;
  const narrativeChapterBody = (
"""
          text = replace_once(text, anchor, replacement, 'V10 scenario grounding seam')
          text = replace_once(
              text,
              "const paragraphs = chapterSection.paragraphs.map((block) => `<p>${esc(block.text)}</p>`).join('');",
              "const paragraphs = chapterSection.paragraphs.map((block) => `<p>${esc(narrativeBlockText(chapterId, block.text))}</p>`).join('');",
              'chapter scenario grounding'
          )
          text = replace_once(
              text,
              "${item.paragraphs.map((block) => `<p>${esc(block.text)}</p>`).join('')}",
              "${item.paragraphs.map((block) => `<p>${esc(narrativeBlockText(chapterId, block.text))}</p>`).join('')}",
              'subsection scenario grounding'
          )
          template_path.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/reports/evidence-model/question-playbooks.ts src/lib/reports/templates/report-template.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix V1.2 recovery evidence and scenario compatibility"
            git push origin HEAD:recovery/essential-v10-v12-minimal-20260824
          fi

      - id: typecheck
        name: Typecheck recovered V10 + V1.2 engine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - id: truth
        name: Prove frozen Vhutshilo V1.2 truth and deterministic report compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/recovery/v12-vhutshilo-score-proof.mjs 2>&1 | tee /tmp/vhutshilo-proof.log
      - id: regressions
        name: Prove V10 report regressions still hold
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npx tsx --test scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs
            npx tsx --test scripts/commercial-quality/essential-v9-second-opinion-regression.mjs
          } 2>&1 | tee /tmp/regressions.log
      - name: Persist provider-free proof diagnostics
        if: always()
        shell: bash
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TRUTH_OUTCOME: ${{ steps.truth.outcome }}
          REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
        run: |
          set -euo pipefail
          mkdir -p scripts/recovery
          status=PASS
          if [ "$TYPECHECK_OUTCOME" != success ] || [ "$TRUTH_OUTCOME" != success ] || [ "$REGRESSIONS_OUTCOME" != success ]; then status=FAIL; fi
          {
            printf 'source_sha=%s\nrun_id=%s\nstatus=%s\nprovider_calls=0\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$status"
            printf 'typecheck=%s\ntruth=%s\nregressions=%s\n' "$TYPECHECK_OUTCOME" "$TRUTH_OUTCOME" "$REGRESSIONS_OUTCOME"
          } > scripts/recovery/.v12-vhutshilo-proof-status
          {
            echo '=== TYPECHECK ==='; cat /tmp/typecheck.log 2>/dev/null || true
            echo '=== VHUTSHILO TRUTH ==='; cat /tmp/vhutshilo-proof.log 2>/dev/null || true
            echo '=== V10 REGRESSIONS ==='; cat /tmp/regressions.log 2>/dev/null || true
          } > scripts/recovery/v12-vhutshilo-proof-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/recovery/.v12-vhutshilo-proof-status scripts/recovery/v12-vhutshilo-proof-diagnostics.txt
          git commit -m "Record recovery provider-free proof diagnostics"
          git pull --rebase origin recovery/essential-v10-v12-minimal-20260824
          git push origin HEAD:recovery/essential-v10-v12-minimal-20260824
          if [ "$status" != PASS ]; then exit 1; fi
