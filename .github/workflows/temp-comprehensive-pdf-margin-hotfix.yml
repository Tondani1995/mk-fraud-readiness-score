name: Temporary Comprehensive PDF Margin Hotfix
on:
  push:
    branches: [hotfix/comprehensive-pdf-margins-20260905]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'actions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-pdf-margins-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Apply bounded PDF margin correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/reports/comprehensive/render-narrative-html.ts')
          s = p.read_text()
          old_page = "  @page{size:A4;margin:17mm 16mm 20mm}"
          new_page = "  @page{size:A4;margin:17mm 12mm 20mm}\n  @page :first{size:A4;margin:0 0 15mm}"
          if old_page not in s:
              raise SystemExit('page margin anchor not found')
          s = s.replace(old_page, new_page, 1)
          old_cover = "  .cover{height:260mm;page-break-after:always;background:var(--mk-navy-900);color:var(--mk-white);padding:24mm 20mm;display:flex;flex-direction:column;justify-content:space-between}"
          new_cover = "  .cover{height:282mm;page-break-after:always;background:var(--mk-navy-900);color:var(--mk-white);padding:24mm 20mm;display:flex;flex-direction:column;justify-content:space-between}"
          if old_cover not in s:
              raise SystemExit('cover height anchor not found')
          s = s.replace(old_cover, new_cover, 1)
          p.write_text(s)
          PY
      - name: Verify bounded source contract
        run: |
          git diff --check
          grep -Fq '@page{size:A4;margin:17mm 12mm 20mm}' src/lib/reports/comprehensive/render-narrative-html.ts
          grep -Fq '@page :first{size:A4;margin:0 0 15mm}' src/lib/reports/comprehensive/render-narrative-html.ts
          grep -Fq '.cover{height:282mm;' src/lib/reports/comprehensive/render-narrative-html.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-comprehensive-pdf-margin-hotfix.yml
          git config user.name "MK Comprehensive PDF Margin Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/comprehensive/render-narrative-html.ts .github/workflows/temp-comprehensive-pdf-margin-hotfix.yml
          git commit -m "fix(comprehensive): tighten PDF margins and bleed cover"
          git push origin HEAD:hotfix/comprehensive-pdf-margins-20260905
