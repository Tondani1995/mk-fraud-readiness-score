name: V1.2 Five-Layer Semantic Apply

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/v12-five-layer-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      - name: Patch semantic reviewer into advisory role
        shell: python
        run: |
          from pathlib import Path

          cascade = Path('src/lib/reports/essential-validation-cascade.ts')
          s = cascade.read_text()
          old = """    if (reviewed) {\n      return {\n        disposition: reviewed.disposition === 'ALLOW' ? 'ALLOW_CONTEXT'\n          : reviewed.disposition === 'REPAIR' ? 'REPAIRABLE'\n            : reviewed.disposition === 'REJECT' ? 'CONFIRMED_VIOLATION' : 'AMBIGUOUS',\n        reasonCode: reviewed.reasonCode,\n        repair: reviewed.disposition === 'REPAIR'\n      };\n    }\n"""
          new = """    if (reviewed) {\n      // Semantic review is advisory to the five-layer cascade, never a release verdict by itself.\n      // Deterministic hard gates have already run. The shared assurance core independently checks\n      // actor, modality, tense, negation and customer-control context so neither a false REJECT nor\n      // an unsafe ALLOW can override the canonical safety decision.\n      const assurance = adjudicateAssuranceSentence(source);\n      if (assurance.disposition === 'CONFIRMED_VIOLATION') {\n        return { disposition: 'CONFIRMED_VIOLATION', reasonCode: assurance.reasonCode, repair: false };\n      }\n      if (reviewed.disposition === 'REPAIR') {\n        return { disposition: 'REPAIRABLE', reasonCode: reviewed.reasonCode, repair: true };\n      }\n      if (reviewed.disposition === 'HOLD') {\n        return { disposition: 'AMBIGUOUS', reasonCode: reviewed.reasonCode, repair: false };\n      }\n      if (reviewed.disposition === 'REJECT') {\n        if (reviewed.reasonCode === 'unsupported_assurance' && assurance.disposition === 'ALLOW_CONTEXT') {\n          return { disposition: 'ALLOW_CONTEXT', reasonCode: `reviewer_adverse_signal_cleared_by_shared_assurance_core:${assurance.reasonCode}`, repair: false };\n        }\n        return { disposition: 'AMBIGUOUS', reasonCode: `semantic_reviewer_adverse_signal_unconfirmed:${reviewed.reasonCode}`, repair: false };\n      }\n      if (assurance.disposition === 'AMBIGUOUS') {\n        return { disposition: 'AMBIGUOUS', reasonCode: assurance.reasonCode, repair: false };\n      }\n      return { disposition: 'ALLOW_CONTEXT', reasonCode: reviewed.reasonCode, repair: false };\n    }\n"""
          if old not in s:
              raise SystemExit('cascade semantic mapping anchor missing')
          cascade.write_text(s.replace(old, new, 1))

          coordinator = Path('src/lib/reports/narrative/essential-manuscript-coordinator.ts')
          s = coordinator.read_text()
          old = """  const semanticDecisions = reviewed?.decisions ?? [];\n  const rejectedDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REJECT');\n  const heldDecisions = semanticDecisions.filter((decision) => decision.disposition === 'HOLD');\n  const repairDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REPAIR');\n"""
          new = """  const semanticDecisions = reviewed?.decisions ?? [];\n  const repairDecisions = semanticDecisions.filter((decision) => decision.disposition === 'REPAIR');\n"""
          if old not in s:
              raise SystemExit('coordinator semantic-decision locals anchor missing')
          s = s.replace(old, new, 1)

          old = """  const semanticPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, semanticDecisions);\n  const rejectedPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, rejectedDecisions);\n  const heldPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, heldDecisions);\n  const repairPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, repairDecisions);\n"""
          new = """  const semanticPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, semanticDecisions);\n  const repairPolicyDecisions = buildSemanticReviewPolicyDiagnostics({ candidates: reviewInput }, repairDecisions);\n"""
          if old not in s:
              raise SystemExit('coordinator policy locals anchor missing')
          s = s.replace(old, new, 1)

          old = """  if (rejectedDecisions.length > 0) {\n    throw new EssentialManuscriptError(\n      'semantic_review',\n      'The semantic reviewer rejected one or more provider-authored narrative blocks.',\n      {\n        ...semanticPolicyBase,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        validationCode: 'semantic_reject',\n        validationIssues: semanticPolicyValidationIssues(rejectedPolicyDecisions, 'A provider-authored narrative block was rejected by semantic grounding review.')\n      }\n    );\n  }\n  if (heldDecisions.length > 0) {\n    throw new EssentialManuscriptError(\n      'semantic_review',\n      'The semantic reviewer held one or more provider-authored narrative blocks for review.',\n      {\n        ...semanticPolicyBase,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        validationCode: 'semantic_hold',\n        validationIssues: semanticPolicyValidationIssues(heldPolicyDecisions, 'A provider-authored narrative block was held by semantic grounding review.')\n      }\n    );\n  }\n"""
          replacement = """  // REJECT and HOLD are reviewer recommendations, not release verdicts. They proceed into the\n  // canonical five-layer cascade, which alone may ACCEPT, REPAIR, HOLD or confirm REJECT.\n"""
          if old not in s:
              raise SystemExit('coordinator early semantic veto anchor missing')
          s = s.replace(old, replacement, 1)

          old = """        validationCode: failure.codes[0],\n        validationIssues: failure.validationIssues\n"""
          new = """        validationCode: failure.codes[0],\n        validationIssues: failure.validationIssues,\n        semanticReviewDiagnostics: semanticPolicyReviewDiagnostics,\n        ...(semanticPolicyDecisions.length > 0 ? { semanticPolicyDecisions } : {})\n"""
          if old not in s:
              raise SystemExit('coordinator cascade diagnostic anchor missing')
          coordinator.write_text(s.replace(old, new, 1))

          test = Path('scripts/commercial-quality/essential-validation-cascade-regression.mjs')
          s = test.read_text()
          if 'essentialCandidateId,' not in s:
              s = s.replace("  adjudicateTextFirstValidation,\n  validateEssentialFinalHtml\n", "  adjudicateTextFirstValidation,\n  essentialCandidateId,\n  validateEssentialFinalHtml\n", 1)
          marker = "test('hard evidence and contract failures cannot be context-cleared', () => {\n"
          additions = r"""test('semantic reviewer REJECT is advisory and safe customer assurance language is cleared by five layers', () => {
  const text = 'Management should obtain independent review of refund and override activity before closure.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'REJECT', reasonCode: 'unsupported_assurance' }] });
  assert.equal(result.publishable, true);
  assert.equal(result.candidates[0].finalDisposition, 'ACCEPT');
});

test('semantic reviewer ALLOW cannot waive a genuine assurance violation', () => {
  const text = 'This report provides independent assurance that the controls are effective.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'ALLOW', reasonCode: 'grounded' }] });
  assert.equal(result.publishable, false);
  assert.equal(result.candidates[0].finalDisposition, 'REJECT');
});

test('unconfirmed non-assurance semantic REJECT becomes HOLD rather than false confirmed rejection', () => {
  const text = 'The finance team performs daily exception reviews across all sites.';
  const path = 'SEC.paragraphs[0]';
  const candidateId = essentialCandidateId('semantic_grounding_block', path, text);
  const report = { ok: true, hardTruth: { status: 'PASS', issues: [] }, semanticCandidates: { status: 'PASS', issues: [] }, repairableSemantic: { status: 'PASS', issues: [] }, quality: { status: 'PASS', issues: [] }, sectionCount: 1, subsectionCount: 0, paragraphCount: 1 };
  const result = adjudicateTextFirstValidation({ parsed: minimalParsed(text), report, factPack: { facts: [] }, requireSemanticReviewer: true, semanticGroundingBlocks: [{ path, span: text }], semanticDecisions: [{ candidateId, disposition: 'REJECT', reasonCode: 'unsupported_frequency' }] });
  assert.equal(result.publishable, false);
  assert.equal(result.candidates[0].finalDisposition, 'HELD_FOR_REVIEW');
  assert.equal(result.blockingCodes.length, 0);
});

"""
          if 'semantic reviewer REJECT is advisory and safe customer assurance language' not in s:
              if marker not in s:
                  raise SystemExit('test insertion anchor missing')
              s = s.replace(marker, additions + marker, 1)
          test.write_text(s)

      - name: Run bounded safety proof
        shell: bash
        run: |
          NODE_TEST="node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs"
          $NODE_TEST scripts/commercial-quality/essential-validation-cascade-regression.mjs
          $NODE_TEST scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          $NODE_TEST scripts/commercial-quality/narrative-assurance-semantics-tests.mjs
          npm run typecheck
          git diff --check

      - name: Commit proven source patch
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/essential-validation-cascade.ts src/lib/reports/narrative/essential-manuscript-coordinator.ts scripts/commercial-quality/essential-validation-cascade-regression.mjs
          git commit -m "route semantic review through five-layer adjudication"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
