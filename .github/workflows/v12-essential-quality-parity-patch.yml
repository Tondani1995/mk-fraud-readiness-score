name: V1.2 Essential Quality Parity Patch

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/v12-essential-quality-parity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - name: Apply bounded V1.2 customer-quality corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/reports/templates/report-template.ts',
              "adaptiveScope.resultStatus === 'PROVISIONAL' ? 'This is a provisional result. Differences in assessed scope or uncertainty may limit comparison with other assessments.' : 'The result reflects the control areas applicable to the organisation, including areas assessed through oversight responses.'",
              "adaptiveScope.resultStatus === 'PROVISIONAL' ? 'The result reflects the control areas applicable to the organisation. Valid scope exclusions and oversight-routed controls are part of the adaptive assessment design; differences in assessed scope may limit direct comparison with other assessments.' : 'The result reflects the control areas applicable to the organisation, including areas assessed through oversight responses.'"
          )
          replace_once(
              'src/lib/reports/templates/report-template.ts',
              '<div class="cover-eyebrow">Independent fraud risk advisory</div>',
              '<div class="cover-eyebrow">Fraud readiness advisory</div>'
          )
          replace_once(
              'src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts',
              "import { renderValidatedCommercialPdf } from '@/lib/reports/render-validated-commercial-pdf';",
              "import { renderValidatedCommercialPdfWithNavigation } from '@/lib/reports/render-validated-commercial-pdf';"
          )
          replace_once(
              'src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts',
              'const pdf = await renderValidatedCommercialPdf({',
              'const pdf = await renderValidatedCommercialPdfWithNavigation({'
          )
          replace_once(
              'src/lib/reports/narrative/whole-manuscript-writer.ts',
              "export const WHOLE_MANUSCRIPT_PROMPT_VERSION = 'mk-fraud-readiness-v1.1-whole-manuscript-blueprint-text-v1';",
              "export const WHOLE_MANUSCRIPT_PROMPT_VERSION = 'mk-fraud-readiness-essential-whole-manuscript-blueprint-text-v2';"
          )
          replace_once(
              'src/lib/reports/narrative/whole-manuscript-writer.ts',
              "'Write the complete MK Fraud Readiness v1.1 advisory manuscript as Markdown.',",
              "'Write the complete MK Fraud Readiness Essential advisory manuscript as Markdown.',"
          )
          old_strength = "'RELATIVE-STRENGTH BOUNDARY. A comparatively stronger self-assessed score, domain or response pattern does not by itself establish that a control, reporting channel, process or capability is functioning, established, workable, effective, operational, embedded or operating in practice. Unless the permitted deterministic facts explicitly establish that present operating state, describe it only as a reported relative strength, a comparatively stronger self-assessed area or a stronger reported position.',"
          new_strength = "'RELATIVE-STRENGTH BOUNDARY. A comparatively stronger self-assessed score, domain or response pattern does not by itself establish that a control, reporting channel, process or capability is functioning, established, active, workable, effective, operational, embedded or operating in practice, and it does not establish a usable, practical or constructive operating foundation. Unless the permitted deterministic facts explicitly establish that present operating state, describe it only as a reported relative strength, a comparatively stronger self-assessed area or a stronger reported position. Do not upgrade self-assessed strength into present-state capability language.',"
          replace_once('src/lib/reports/narrative/whole-manuscript-writer.ts', old_strength, new_strength)

          old_semantic = "'ALLOW means every customer-specific factual proposition in the block is semantically grounded by its permitted facts and remains inside the assurance boundary. Inspect structure, actors/teams, mechanisms, workflow/routing, sites, populations, sampling, frequency, capacity, ownership, control state, causality, comparisons, knowledge concentration and assurance language, not only the warning signals. Distinguish descriptive current/past claims from prescriptive advisory content: a target-state recommendation, roadmap action or management instruction does not assert that the organisation already operates that way. Prescriptive control design may elaborate the deterministic requiredManagementTakeaway and Blueprint role using generic implementation mechanics, but it must not invent client-specific actors, systems, locations, populations, frequencies, costs or completed evidence states. REPAIR means the management implication is valid but the target prose overstates the evidence. REJECT means the proposition cannot be made true without changing deterministic meaning. HOLD means unresolved ambiguity.',"
          new_semantic = "'ALLOW means every customer-specific factual proposition in the block is semantically grounded by its permitted facts and remains inside the assurance boundary. Inspect structure, actors/teams, mechanisms, workflow/routing, sites, populations, sampling, frequency, capacity, ownership, control state, causality, comparisons, knowledge concentration and assurance language, not only the warning signals. Distinguish descriptive current/past claims from prescriptive advisory content: a target-state recommendation, roadmap action or management instruction does not assert that the organisation already operates that way. Prescriptive control design may elaborate the deterministic requiredManagementTakeaway and Blueprint role using generic implementation mechanics, but it must not invent client-specific actors, systems, locations, populations, frequencies, costs or completed evidence states. A self-assessed relative strength or higher score is not evidence that a control or capability is functioning, established, active, workable, effective, operational, embedded or a usable/practical/constructive operating foundation. Unless a permitted fact explicitly establishes that present operating state, such wording must be REPAIR rather than ALLOW; retain the management implication but rewrite it as a reported relative strength or comparatively stronger self-assessed position. REPAIR means the management implication is valid but the target prose overstates the evidence. REJECT means the proposition cannot be made true without changing deterministic meaning. HOLD means unresolved ambiguity.',"
          replace_once('src/lib/reports/narrative/whole-manuscript-writer.ts', old_semantic, new_semantic)

      - name: Commit bounded correction
        shell: bash
        run: |
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/reports/templates/report-template.ts \
                  src/app/score/api/qa/v12-essential-comparison/'[profile]'/route.ts \
                  src/lib/reports/narrative/whole-manuscript-writer.ts
          git diff --cached --check
          git commit -m "align V1.2 Essential customer output with approved report quality"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
