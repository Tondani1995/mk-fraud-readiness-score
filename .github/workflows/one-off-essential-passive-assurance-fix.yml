name: One-off Essential passive assurance classifier fix

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
    paths:
      - .github/workflows/one-off-essential-passive-assurance-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch passive customer-owned verification classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/reports/narrative/validation.ts')
          text = p.read_text()
          anchor = """const CUSTOMER_RECOMMENDED_INDEPENDENT_REVIEW = /(?:^|[.!?]\\s+)\\s*independently\\s+(?:review|verify)\\b|\\b(?:should|must|need(?:s)?\\s+to|is required to|are required to)\\s+independently\\s+(?:review|verify)\\b/i;\n"""
          addition = anchor + """// A customer-owned verification recommendation is also safe when written in passive form, for\n// example \"operating effectiveness should be independently verified before closure\". This is\n// future/normative control design, not a claim that MK or the assessment has already provided\n// assurance. Past-tense or present-perfect assertions remain blocked by the absolute rules above.\nconst CUSTOMER_PASSIVE_CONTROL_VERIFICATION = /\\b(?:operating effectiveness|control effectiveness|controls?|control environment|control design|control operation|implementation|remediation|evidence(?: package)?|closure)\\b.{0,180}\\b(?:(?:should|must|can|could)\\s+(?:then\\s+)?be|(?:need(?:s)?\\s+to|is required to|are required to)\\s+be)\\s+independently\\s+(?:verified|reviewed)\\b/i;\n"""
          if 'CUSTOMER_PASSIVE_CONTROL_VERIFICATION' not in text:
              if anchor not in text:
                  raise SystemExit('customer independent-review anchor missing')
              text = text.replace(anchor, addition, 1)

          old = """    || CUSTOMER_RECOMMENDED_INDEPENDENT_REVIEW.test(assuranceText)\n    || CUSTOMER_GOVERNANCE_ROLE_SEPARATION.test(assuranceText)) {\n"""
          new = """    || CUSTOMER_RECOMMENDED_INDEPENDENT_REVIEW.test(assuranceText)\n    || CUSTOMER_PASSIVE_CONTROL_VERIFICATION.test(assuranceText)\n    || CUSTOMER_GOVERNANCE_ROLE_SEPARATION.test(assuranceText)) {\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('classifier allowance anchor missing')
          p.write_text(text)

          t = Path('scripts/commercial-quality/essential-assurance-boundary-tests.mjs')
          tests = t.read_text()
          marker = """assert.equal(\n  classifyAssuranceLanguage('This assessment has independently verified that the control operates as designed.')?.category,\n  'prohibited_assurance'\n);\n"""
          extra = marker + """\n// Regression from Mahlori attempt b4d82940-8391-4c10-9fd8-dbd41d4151a3: a target-control\n// recommendation used passive future/normative wording and was incorrectly treated as MK assurance.\nassert.equal(\n  classifyAssuranceLanguage('Operating effectiveness should then be independently verified before management closes the action.')?.category,\n  'customer_control_activity'\n);\nassert.equal(\n  classifyAssuranceLanguage('The control evidence must be independently reviewed before reliance.')?.category,\n  'customer_control_activity'\n);\nassert.equal(\n  classifyAssuranceLanguage('Control effectiveness can be independently verified once the evidence pack is complete.')?.category,\n  'customer_control_activity'\n);\n// Do not weaken the assurance boundary: assertions that verification already occurred remain blocked.\nassert.equal(\n  classifyAssuranceLanguage('Operating effectiveness was independently verified.')?.category,\n  'prohibited_assurance'\n);\nassert.equal(\n  classifyAssuranceLanguage('Operating effectiveness has been independently verified.')?.category,\n  'prohibited_assurance'\n);\nassert.equal(\n  classifyAssuranceLanguage('The report should independently verify the control before management relies on it.')?.category,\n  'prohibited_assurance'\n);\nassert.equal(\n  classifyAssuranceLanguage('The evidence must be independently verified by MK before closure.')?.category,\n  'prohibited_assurance'\n);\n"""
          if 'Regression from Mahlori attempt b4d82940' not in tests:
              if marker not in tests:
                  raise SystemExit('assurance regression test anchor missing')
              tests = tests.replace(marker, extra, 1)
              t.write_text(tests)
          PY

      - name: Prove assurance boundary provider-free
        run: npx tsx --test scripts/commercial-quality/essential-assurance-boundary-tests.mjs

      - name: Prove manuscript render binding provider-free
        run: npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Commit source and regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/reports/narrative/validation.ts scripts/commercial-quality/essential-assurance-boundary-tests.mjs
          if git diff --cached --quiet; then
            echo "Passive assurance classifier fix already applied."
            exit 0
          fi
          git commit -m "Allow customer-owned passive verification recommendations"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
