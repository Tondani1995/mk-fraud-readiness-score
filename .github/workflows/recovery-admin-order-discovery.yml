name: Recovery admin order discovery

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/recovery-admin-order-discovery.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      S1: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      S2: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      S3: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
      S4: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      S5: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      V1: ${{ secrets.VERCEL_TOKEN }}
      V2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      U1: ${{ secrets.STAGING_SUPABASE_URL }}
      U2: ${{ secrets.SUPABASE_STAGING_URL }}
      R1: ${{ vars.STAGING_SUPABASE_URL }}
      R2: ${{ vars.SUPABASE_STAGING_URL }}
    steps:
      - name: Check existing credential hooks without exposing values
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${!1:-}" ]; then printf '%s=SET\n' "$1"; else printf '%s=UNSET\n' "$1"; fi; }
          for name in VERCEL_PROTECTION_BYPASS S1 S2 S3 S4 S5 V1 V2 U1 U2 R1 R2; do present "$name"; done
