name: Recovery admin order discovery

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/recovery-admin-order-discovery.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: https://iszihmmbgsfefawqmnwo.supabase.co
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify existing service key against staging without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVICE_KEY"
          status=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            "$STAGING_URL/rest/v1/orders?select=order_reference&order_reference=eq.MKORD-2026-828844DD")
          printf 'staging_http=%s\n' "$status"
          if [ "$status" = "200" ]; then
            if grep -q 'MKORD-2026-828844DD' /tmp/result.json; then
              echo 'staging_key_match=YES'
            else
              echo 'staging_key_match=YES_BUT_ORDER_NOT_RETURNED'
            fi
          else
            echo 'staging_key_match=NO'
            head -c 300 /tmp/result.json | sed -E 's/[A-Za-z0-9_-]{20,}/[redacted]/g' || true
            echo
          fi
