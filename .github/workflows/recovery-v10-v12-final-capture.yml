name: Publish recovered Vhutshilo Essential artefact

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/recovery-v10-v12-final-capture.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OUT_DIR: qa-output/recovered-vhutshilo-essential-final
      PDF_NAME: RPT-MKFRS-V12-ESS-VHUTSHILO-V1.pdf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-brand-20260824
          fetch-depth: 0

      - name: Verify existing captured PDF only
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT_DIR/$PDF_NAME"
          test -f "$OUT_DIR/sha256.txt"
          test -f "$OUT_DIR/meta.json"
          test -f "$OUT_DIR/headers.txt"
          grep -Fxq SUCCESS "$OUT_DIR/outcome.txt"
          sha256sum -c "$OUT_DIR/sha256.txt"
          test "$(cat "$OUT_DIR/bytes.txt")" = "321825"
          grep -Fq '"score":43.33' "$OUT_DIR/meta.json"
          grep -Fq '"finalMaturity":"Developing"' "$OUT_DIR/meta.json"
          grep -i -q '^x-mk-recovery-proof: PASS' "$OUT_DIR/headers.txt"
          grep -i -q '^x-mk-provider-calls: 1' "$OUT_DIR/headers.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$OUT_DIR/workflow-run-id.txt"

      - name: Upload recovered PDF and evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovered-vhutshilo-essential-final
          path: qa-output/recovered-vhutshilo-essential-final
          if-no-files-found: error
          retention-days: 7

      - name: Commit workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MK Recovery QA"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT_DIR/workflow-run-id.txt"
          git commit -m "Record recovered Essential artefact run ID"
          git push origin HEAD:recovery/essential-v10-v12-brand-20260824
