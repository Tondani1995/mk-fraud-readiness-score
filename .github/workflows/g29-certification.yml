name: G29 certification evidence

on:
  pull_request:
    branches: [fix/rc1-control-plane-profile-read]
    paths:
      - '.github/workflows/g29-certification.yml'
      - 'scripts/g29-*.mjs'
      - 'scripts/consolidation-local-respondent-integration.mjs'
      - 'scripts/pre-g30-ai-route-authority-tests.mjs'
      - 'scripts/pre-g30-migration-target-check.mjs'
      - 'scripts/pre-g30-migration-target-manifest.json'
      - 'scripts/pre-g30-adaptive-launch-tests.mjs'
      - 'scripts/pre-g30-staging-worker-runtime.mjs'
      - 'scripts/phase23-assessment-browser-tests.mjs'
      - 'src/lib/adaptive/server.ts'
      - 'src/app/score/start/page.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      preview_base_url:
        description: 'Exact READY Preview deployment URL for this commit'
        required: false
        type: string
      invoke_staging_worker:
        description: 'Invoke the scoped Staging fulfilment worker for the retained G29 attempt'
        required: false
        default: false
        type: boolean
      fulfilment_attempt_id:
        description: 'Existing queued fulfilment attempt UUID; required when invoking the worker'
        required: false
        type: string
      invoke_pre_g30_shadow:
        description: 'Invoke the retained Journey 5 full-scale structured shadow exactly once'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

env:
  SUPABASE_CLI_VERSION: '2.110.0'
  G29_CERTIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  resolve-preview:
    name: Resolve immutable Preview deployment
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    runs-on: ubuntu-latest
    outputs:
      preview_base_url: ${{ steps.resolve.outputs.preview_base_url }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [ -n "${{ inputs.preview_base_url }}" ]; then
            printf 'preview_base_url=%s\n' "${{ inputs.preview_base_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          for attempt in $(seq 1 30); do
            deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&environment=Preview&per_page=20" \
              --jq '[.[] | select(.environment == "Preview")] | first | .id // empty')"
            if [ -n "$deployment_id" ]; then
              preview_url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --jq '[.[] | select(.state == "success" and (.environment_url // "") != "") | .environment_url] | last // empty')"
              if [ -n "$preview_url" ]; then
                printf 'preview_base_url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No successful immutable Preview deployment was reported for ${sha}." >&2
          exit 1

  pre-g30-staging-worker-runtime:
    name: PRE-G30 authorized Staging worker runtime
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.invoke_staging_worker == true && inputs.invoke_pre_g30_shadow != true }}
    needs: [resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_G30_PREVIEW_BASE_URL: ${{ needs.resolve-preview.outputs.preview_base_url }}
      PRE_G30_EXPECTED_SHA: ${{ github.sha }}
      PRE_G30_ATTEMPT_ID: ${{ inputs.fulfilment_attempt_id }}
      PRE_G30_RUNTIME_OUTPUT: tmp/g29/pre-g30-staging-worker-runtime.json
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Assert exact dispatch ref, PR head and immutable Preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_BASE_URL: ${{ needs.resolve-preview.outputs.preview_base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/52" --jq '.head.sha')"
          test "$GITHUB_SHA" = "$pr_head_sha"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Preview&per_page=20" \
            --jq '[.[] | select(.environment == "Preview")] | first | .id // empty')"
          test -n "$deployment_id"
          deployment_url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --jq '[.[] | select(.state == "success" and (.environment_url // "") != "") | .environment_url] | last // empty')"
          test -n "$deployment_url"
          test "$deployment_url" = "$PREVIEW_BASE_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Invoke the scoped Staging worker without exposing CRON_SECRET
        run: |
          set +x
          set -Eeuo pipefail
          runtime_tmp_dir="$(mktemp -d)"
          chmod 700 "$runtime_tmp_dir"
          cleanup_runtime_tmp() {
            set +e
            if [ -d "$runtime_tmp_dir" ]; then
              find "$runtime_tmp_dir" -type f -exec unlink {} + 2>/dev/null || true
              rmdir "$runtime_tmp_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_runtime_tmp EXIT
          PRE_G30_RUNTIME_TMP="$runtime_tmp_dir" node scripts/pre-g30-staging-worker-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-g30-staging-worker-runtime
          path: tmp/g29/pre-g30-staging-worker-runtime.json
          if-no-files-found: error

  pre-g30-full-scale-shadow:
    name: PRE-G30 branch-bound full-scale shadow
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRE_G30_PREVIEW_BASE_URL: ${{ inputs.preview_base_url }}
      PRE_G30_EXPECTED_SHA: ${{ github.sha }}
      PRE_G30_SHADOW_OUTPUT: tmp/g29/pre-g30-full-scale-shadow.json
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert exact branch, PR head and immutable Preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_BASE_URL: ${{ inputs.preview_base_url }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/52 --jq '.head.sha')" = "$GITHUB_SHA"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Preview&per_page=20" --jq '[.[] | select(.environment == "Preview")] | first | .id // empty')"
          test -n "$deployment_id"
          test -n "$PREVIEW_BASE_URL"
      - name: Invoke the protected route without exposing secrets
        run: |
          set +x
          set -Eeuo pipefail
          runtime_tmp_dir="$(mktemp -d)"
          chmod 700 "$runtime_tmp_dir"
          cleanup_runtime_tmp() { set +e; find "$runtime_tmp_dir" -type f -exec unlink {} + 2>/dev/null || true; rmdir "$runtime_tmp_dir" 2>/dev/null || true; }
          trap cleanup_runtime_tmp EXIT
          node scripts/pre-g30-full-scale-shadow-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-g30-full-scale-shadow
          path: tmp/g29/pre-g30-full-scale-shadow.json
          if-no-files-found: error

  loopback-database:
    name: G29 loopback database suites
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      G29_RUN_LIVE: '1'
      G29_SUITE_IDS: database.old-schema-freeze,database.migration-replay,delivery.access-eligibility,integration.payment-db
      G29_OUTPUT: tmp/g29/loopback-database.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start disposable local Supabase
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/g29
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor > tmp/g29/supabase-start.log 2>&1
          eval "$(supabase status -o env)"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"
          printf 'SUPABASE_LOCAL_API_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          test "$LOCAL_DB_URL" = 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$LOCAL_DB_URL" -XAtc 'select 1' | grep -qx 1
      - name: Run service-role contract before disposable runtime grants
        run: G29_OUTPUT=tmp/g29/service-role-contract.json node scripts/g29-service-role-contract-runner.mjs
      - name: Prepare disposable payment fixture boundary
        run: |
          set -Eeuo pipefail
          psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 --file=scripts/phase1-disposable-runtime-grants.sql
          psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 \
            --file=scripts/rc1-release-disposable-test-database.sql
          psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 \
            --file=scripts/g29-disposable-payment-fixture.sql
          test "$(psql "$LOCAL_DB_URL" -XAtc "select public.rc1_freeze_status()->>'state'")" = 'released'
      - name: Run selected G29 suites
        run: npm run g29:regression -- --live
      - name: Clean disposable payment fixture
        if: always()
        run: psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 --file=scripts/g29-disposable-payment-fixture-cleanup.sql || true
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-loopback-database
          path: tmp/g29
          if-no-files-found: warn

  adaptive-staging:
    name: G29 adaptive Staging DB suite
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      G29_RUN_LIVE: '1'
      G29_SUITE_IDS: integration.adaptive-db
      G29_OUTPUT: tmp/g29/adaptive-staging.json
      G25_SUPABASE_URL: https://penhenkzfrtmcxklodtu.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      G25_DB_TEST_REF: MKADAPT-QA-20260804-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Map the canonical Staging service-role secret for the legacy suite interface
        run: |
          set -Eeuo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          printf 'G25_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Run adaptive Staging DB suite
        run: npm run g29:regression -- --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-adaptive-staging
          path: tmp/g29
          if-no-files-found: warn

  legacy-respondent:
    name: G29 legacy respondent integration
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      G29_RUN_LIVE: '1'
      G29_SUITE_IDS: legacy.respondent-integration
      G29_OUTPUT: tmp/g29/legacy-respondent.json
      LOCAL_INTEGRATION_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      ASSESSMENT_TOKEN_PEPPER: g29-loopback-only-assessment-pepper
      JWT_SECRET: g29-loopback-only-jwt-secret
      PHASE1_DELIVERY_MODE: disabled
      PAYMENT_PROVIDER_MODE: double
      MK_RC1_OPERATION_FREEZE_MODE: released
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start disposable local Supabase
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/g29
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor > tmp/g29/supabase-start.log 2>&1
          eval "$(supabase status -o env)"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"
          psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 --file=scripts/phase1-disposable-runtime-grants.sql
          psql "$LOCAL_DB_URL" -X --set=ON_ERROR_STOP=1 --file=scripts/rc1-release-disposable-test-database.sql
          test "$(psql "$LOCAL_DB_URL" -XAtc "select public.rc1_freeze_status()->>'state'")" = 'released'
      - name: Build and start the real application route
        run: |
          set -Eeuo pipefail
          npm run build > tmp/g29/legacy-build.log 2>&1
          npm start -- --port 3100 > tmp/g29/legacy-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$LOCAL_INTEGRATION_BASE_URL/score" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$LOCAL_INTEGRATION_BASE_URL/score" > /dev/null
      - name: Run the permanent legacy submission suite
        run: npm run g29:regression -- --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-legacy-respondent
          path: tmp/g29
          if-no-files-found: warn
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true

  responsive-preview:
    name: G29 Preview responsive browser suite
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    needs: [resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      G29_RUN_LIVE: '1'
      G29_SUITE_IDS: responsive.browser
      G29_OUTPUT: tmp/g29/responsive-preview.json
      PHASE23_BASE_URL: ${{ needs.resolve-preview.outputs.preview_base_url }}
      PHASE23_SYNTHETIC_MARKER: MKG29-QA-
      PHASE23_BROWSER_EVIDENCE_DIR: tmp/g29/browser
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Locate preinstalled Chrome/Chromium
        run: |
          set -Eeuo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          printf 'CHROME_EXECUTABLE=%s\n' "$chrome" >> "$GITHUB_ENV"
      - name: Run Preview responsive suite
        run: npm run g29:regression -- --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-responsive-preview
          path: tmp/g29
          if-no-files-found: warn

  product-baseline:
    name: G29 product baseline suites
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      G29_RUN_LIVE: '1'
      G29_SUITE_IDS: adaptive.branch-matrix,adaptive.engine,adaptive.scoring,adaptive.correction,adaptive.gateway-audit,adaptive.customer-copy,legacy.engine,legacy.scenarios,legacy.snapshot,legacy.report-contract,commercial.events,commercial.conversion,commercial.report-engine,commercial.payment-verification,commercial.numeric-claims,commercial.quality-a,commercial.quality-b,commercial.quality-c,commercial.quality-d,commercial.quality-e,delivery.email,delivery.webhook-adversarial,delivery.provider-faults,delivery.storage-faults,delivery.security-closure,delivery.resend-rate-limit,database.accepted-migrations,database.ai-route-authority,database.migration-target-separation,database.adaptive-launch-authority
      G29_OUTPUT: tmp/g29/product-baseline.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run product baseline suites
        run: npm run g29:regression -- --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-product-baseline
          path: tmp/g29/product-baseline.json
          if-no-files-found: warn

  retained-pdf-review:
    name: G29 retained PDF evidence review
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    needs: [resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      G29_STAGING_SUPABASE_URL: https://penhenkzfrtmcxklodtu.supabase.co
      G29_PREVIEW_BASE_URL: ${{ needs.resolve-preview.outputs.preview_base_url }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      G29_PDF_OUTPUT: tmp/g29/retained-pdf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install PDF review tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Verify PDF tooling
        run: command -v pdfinfo && command -v pdftoppm && command -v pdftotext
      - name: Download and review retained PDF
        run: node scripts/g29-retained-pdf-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-retained-pdf-review
          path: tmp/g29/retained-pdf
          if-no-files-found: warn

  merge:
    name: G29 merged certification result
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.invoke_pre_g30_shadow == true) }}
    needs: [resolve-preview, pre-g30-staging-worker-runtime, loopback-database, adaptive-staging, legacy-respondent, responsive-preview, product-baseline, retained-pdf-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: g29-*
          path: tmp/g29-artifacts
          merge-multiple: false
      - name: Merge and require every G29 suite exactly once
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "${{ inputs.invoke_staging_worker }}" = 'true' ] && [ "${{ needs.pre-g30-staging-worker-runtime.result }}" != 'success' ]; then
            echo 'The requested PRE-G30 Staging worker runtime did not succeed.' >&2
            exit 1
          fi
          mkdir -p tmp/g29
          find tmp/g29-artifacts -type f -name '*.json' -print
          node scripts/g29-merge-results.mjs \
            tmp/g29-artifacts/g29-loopback-database/loopback-database.json \
            tmp/g29-artifacts/g29-loopback-database/service-role-contract.json \
            tmp/g29-artifacts/g29-adaptive-staging/adaptive-staging.json \
            tmp/g29-artifacts/g29-legacy-respondent/legacy-respondent.json \
            tmp/g29-artifacts/g29-responsive-preview/responsive-preview.json \
            tmp/g29-artifacts/g29-product-baseline/product-baseline.json \
            tmp/g29-artifacts/g29-retained-pdf-review/retained-pdf-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g29-merged-certification
          path: tmp/g29/g29-merged-result.json
          if-no-files-found: warn
