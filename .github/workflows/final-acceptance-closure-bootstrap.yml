name: Final Acceptance Closure Bootstrap

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality

permissions:
  contents: write

jobs:
  close-known-gates:
    if: github.event.head_commit.message == 'Bootstrap final acceptance closure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out commercial branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install accepted head dependencies
        run: npm ci

      - name: Apply reviewed source closure
        shell: bash
        run: |
          set -Eeuo pipefail
          pre_hash="$(node scripts/rc1-service-role-privilege-contract-analysis.mjs --print-hash)"
          test "$pre_hash" = "5c39f2551a9225477845b5cd90f7f5069626b91871743fa01f8493ff32326725"
          python3 scripts/commercial-quality/apply-final-acceptance-closure.py

          # Manual review confirmed these are the same three Storage API operations with line-only
          # drift in phase1-manual-fulfilment.ts: download, upload, orphan cleanup remove.
          sed -i 's#src/lib/reports/phase1-manual-fulfilment.ts:291#src/lib/reports/phase1-manual-fulfilment.ts:297#' scripts/rc1-service-role-privilege-contract.manifest.json
          sed -i 's#src/lib/reports/phase1-manual-fulfilment.ts:605#src/lib/reports/phase1-manual-fulfilment.ts:665#' scripts/rc1-service-role-privilege-contract.manifest.json
          sed -i 's#src/lib/reports/phase1-manual-fulfilment.ts:755#src/lib/reports/phase1-manual-fulfilment.ts:815#' scripts/rc1-service-role-privilege-contract.manifest.json

          # Puppeteer 25 made defaultArgs async. Await the exact same default-argument construction;
          # otherwise launch receives Promise<string[]> as args and fails before Chromium starts.
          sed -i 's/? puppeteer.defaultArgs(/? await puppeteer.defaultArgs(/' src/lib/reports/render-pdf.ts
          sed -i 's/: puppeteer.defaultArgs(/: await puppeteer.defaultArgs(/' src/lib/reports/render-pdf.ts

          post_hash="$(node scripts/rc1-service-role-privilege-contract-analysis.mjs --print-hash)"
          POST_HASH="$post_hash" python3 -c "import os; from pathlib import Path; p=Path('scripts/rc1-service-role-privilege-contract.manifest.json'); t=p.read_text(); old='d713344b40ed332f5e5f0b98f7904a1d5f0c3268c51d96d25b0206fb36a082d6'; assert t.count(old)==1; p.write_text(t.replace(old, os.environ['POST_HASH'], 1)); print('accepted reviewed AST inventory', os.environ['POST_HASH'])"
          npm install puppeteer-core@25.5.0 --save-exact --package-lock-only --ignore-scripts

      - name: Prove closure before committing
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run rc1:analyze-service-role-contract
          npm run phase6:test-engine
          npm run phase14:test-node24-pdf
          node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-assurance-boundary-tests.mjs
          npm run typecheck
          npm run phase8:test-admin
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node scripts/phase14-dependency-audit-gate.mjs /tmp/npm-audit-production.json
          git diff --check

      - name: Commit proven non-workflow closure
        shell: bash
        run: |
          set -Eeuo pipefail
          # The GitHub Actions token cannot update workflow files. Restore the permanent workflow
          # for this push; ChatGPT will add the already-proven safety-net step through the GitHub
          # connector in the immediate cleanup commit.
          git checkout -- .github/workflows/essential-provider-diagnostics.yml
          rm -f tmp/phase14-node24-chromium-smoke.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/score/admin/orders/[orderReference]/page.tsx \
            src/app/score/api/admin/orders/[orderReference]/mark-delivered/route.ts \
            src/lib/reports/render-pdf.ts \
            scripts/rc1-service-role-privilege-contract.manifest.json \
            scripts/phase6-engine-direct-tests.mjs \
            scripts/phase14-node24-chromium-smoke.mjs \
            scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs \
            package.json \
            package-lock.json
          git diff --cached --check
          git commit -m "Close final acceptance product gates"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
