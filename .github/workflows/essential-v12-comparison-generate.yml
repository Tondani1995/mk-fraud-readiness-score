name: Essential V1.2 Three-Report Generation

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/essential-v12-comparison-generate.yml

permissions:
  contents: write

jobs:
  generate-three:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_URL: https://mk-fraud-platform-ius6r6vcj-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - name: Record exact workflow run
        shell: bash
        run: |
          mkdir -p qa-output/v12-essential
          printf '%s\n' "$GITHUB_RUN_ID" > qa-output/v12-essential/latest-run-id.txt
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-essential/latest-run-id.txt
          if ! git diff --cached --quiet; then
            git commit -m "record V1.2 report generation run"
            git push origin HEAD:qa/v12-essential-comparison-20260823
          fi

      - name: Preview access preflight
        shell: bash
        run: |
          if [ -z "$VERCEL_PROTECTION_BYPASS" ]; then
            echo "VERCEL_PROTECTION_BYPASS secret is missing; refusing generation."
            exit 1
          fi
          curl -fsS \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            "$PREVIEW_URL/score/api/qa/v12-essential-comparison/bokamoso?format=meta" \
            | tee /tmp/v12-meta.json
          grep -F 'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821' /tmp/v12-meta.json
          grep -F 'MFRS-V1.2-CANDIDATE-OWNER-CORRECTION' /tmp/v12-meta.json

      - name: Generate three exact V1.2 Essential PDFs
        shell: bash
        run: |
          mkdir -p v12-reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const base = process.env.PREVIEW_URL.replace(/\/$/, '');
          const bypass = process.env.VERCEL_PROTECTION_BYPASS;
          if (!bypass) throw new Error('VERCEL_PROTECTION_BYPASS is missing.');
          const headers = { 'x-vercel-protection-bypass': bypass };
          const reports = [
            { profile: 'bokamoso', name: 'Bokamoso_Skills_Institute_Essential_V1_2.pdf' },
            { profile: 'siyakhula', name: 'Siyakhula_Community_Foundation_Essential_V1_2.pdf' },
            { profile: 'vhutshilo', name: 'Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' }
          ];
          const summary = [];

          for (let index = 0; index < reports.length; index += 1) {
            const report = reports[index];
            const metaResponse = await fetch(`${base}/score/api/qa/v12-essential-comparison/${report.profile}?format=meta`, { headers });
            const metaText = await metaResponse.text();
            if (!metaResponse.ok) throw new Error(`${report.profile}: metadata HTTP ${metaResponse.status}: ${metaText.slice(0,700)}`);
            const meta = JSON.parse(metaText);
            if (meta.graphVersion !== 'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821') throw new Error(`${report.profile}: wrong graph ${meta.graphVersion}`);
            if (meta.methodology !== 'MFRS-V1.2-CANDIDATE-OWNER-CORRECTION') throw new Error(`${report.profile}: wrong methodology ${meta.methodology}`);

            console.log(`[${index + 1}/3] ${report.profile}: ${meta.score} ${meta.finalMaturity}; issuing exactly one report-generation request.`);
            const response = await fetch(`${base}/score/api/qa/v12-essential-comparison/${report.profile}`, { headers });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`${report.profile}: generation HTTP ${response.status}: ${text.slice(0,1500)}`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length < 100000 || bytes.subarray(0,4).toString() !== '%PDF') throw new Error(`${report.profile}: invalid PDF (${bytes.length} bytes)`);
            fs.writeFileSync(`v12-reports/${report.name}`, bytes);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            summary.push({ ...meta, file: report.name, bytes: bytes.length, sha256 });
            console.log(`[${index + 1}/3] PASS ${report.name}: ${bytes.length} bytes; ${sha256}`);
          }

          fs.writeFileSync('v12-reports/summary.json', JSON.stringify(summary, null, 2));
          console.log('ESSENTIAL V1.2 THREE-REPORT GENERATION: PASS 3/3');
          NODE

      - name: Upload V1.2 Essential reports
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-three-report-pack
          path: v12-reports/*
          if-no-files-found: error
          retention-days: 14

      - name: Commit generation summary
        shell: bash
        run: |
          mkdir -p qa-output/v12-essential
          cp v12-reports/summary.json qa-output/v12-essential/latest-summary.json
          git fetch origin qa/v12-essential-comparison-20260823
          git reset --soft origin/qa/v12-essential-comparison-20260823
          git add qa-output/v12-essential/latest-summary.json
          git commit -m "record V1.2 three-report summary" || exit 0
          git push origin HEAD:qa/v12-essential-comparison-20260823
