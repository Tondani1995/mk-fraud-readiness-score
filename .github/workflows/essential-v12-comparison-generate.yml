name: Essential V1.2 Bokamoso Semantic Proof

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/essential-v12-comparison-generate.yml

permissions:
  contents: write

jobs:
  bokamoso-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_URL: https://mk-fraud-platform-git-qa-v12-essential-38fe43-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823
          fetch-depth: 0

      - name: Add exact semantic rejection visibility to synthetic QA route only
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts')
          s = p.read_text()

          old_import = "import { composeEssentialManuscript } from '@/lib/reports/narrative/essential-manuscript-coordinator';"
          new_import = "import { composeEssentialManuscript, EssentialManuscriptError } from '@/lib/reports/narrative/essential-manuscript-coordinator';\nimport type { EssentialSemanticReviewer } from '@/lib/reports/narrative/semantic-reviewer';"
          if new_import not in s:
              if old_import not in s: raise SystemExit('Coordinator import seam missing.')
              s = s.replace(old_import, new_import, 1)

          old_meta = "return { profile:profileKey, organisationName:profile.organisationName"
          new_meta = "return { diagnosticRevision:'semantic-audit-v1', profile:profileKey, organisationName:profile.organisationName"
          if new_meta not in s:
              if old_meta not in s: raise SystemExit('Metadata seam missing.')
              s = s.replace(old_meta, new_meta, 1)

          old_start = "  try {\n    const {data}=assembledFor(profileKey);"
          new_start = "  let semanticAudit: Array<Record<string, unknown>> | undefined;\n  try {\n    const {data}=assembledFor(profileKey);"
          if new_start not in s:
              if old_start not in s: raise SystemExit('Route try seam missing.')
              s = s.replace(old_start, new_start, 1)

          old_compose = "    const composed=await composeEssentialManuscript({factPack:buildEssentialNarrativeFactPack(data,reportEvidenceModel,projection),writer:createV11WholeManuscriptWriter(MODEL,{allowTailRecovery:false})});"
          new_compose = """    const writer=createV11WholeManuscriptWriter(MODEL,{allowTailRecovery:false});
    const semanticReviewer: EssentialSemanticReviewer | undefined = writer.reviewSemanticCandidates ? {
      review: async (reviewRequest) => {
        const result=await writer.reviewSemanticCandidates!(reviewRequest);
        semanticAudit=result.decisions.filter((decision)=>decision.disposition!=='ALLOW').map((decision)=>{
          const candidate=reviewRequest.candidates.find((item)=>item.candidateId===decision.candidateId);
          return { candidateId:decision.candidateId, disposition:decision.disposition, reasonCode:decision.reasonCode, ruleCode:candidate?.ruleCode, path:candidate?.path, blueprintPath:candidate?.blueprintPath, chapterTitle:candidate?.chapterTitle, sectionTitle:candidate?.sectionTitle, subsectionTitle:candidate?.subsectionTitle, span:candidate?.paragraph };
        });
        return result;
      }
    } : undefined;
    const composed=await composeEssentialManuscript({factPack:buildEssentialNarrativeFactPack(data,reportEvidenceModel,projection),writer,semanticReviewer});"""
          if new_compose not in s:
              if old_compose not in s: raise SystemExit('Compose seam missing.')
              s = s.replace(old_compose, new_compose, 1)

          old_catch = """    console.error('v12_essential_comparison_failed',{profile:profileKey,message,validation});
    return NextResponse.json({ok:false,profile:profileKey,error:message.slice(0,500),validation},{status:500,headers:{'Cache-Control':'no-store'}});"""
          new_catch = """    const manuscriptDiagnostics=error instanceof EssentialManuscriptError ? error.diagnostics : undefined;
    console.error('v12_essential_comparison_failed',{profile:profileKey,message,validation,semanticAudit,manuscriptDiagnostics});
    return NextResponse.json({ok:false,profile:profileKey,error:message.slice(0,500),validation,semanticAudit,manuscriptDiagnostics},{status:500,headers:{'Cache-Control':'no-store'}});"""
          if new_catch not in s:
              if old_catch not in s: raise SystemExit('Route catch seam missing.')
              s = s.replace(old_catch, new_catch, 1)

          p.write_text(s)

      - name: Typecheck diagnostic route before any provider call
        shell: bash
        run: |
          npm run typecheck
          git diff --check

      - name: Commit QA diagnostic and record exact run
        shell: bash
        run: |
          mkdir -p qa-output/v12-essential
          printf '%s\n' "$GITHUB_RUN_ID" > qa-output/v12-essential/latest-run-id.txt
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/score/api/qa/v12-essential-comparison/[profile]/route.ts' qa-output/v12-essential/latest-run-id.txt
          git commit -m "expose V1.2 semantic reject and record proof run" || true
          git push origin HEAD:qa/v12-essential-comparison-20260823

      - name: Wait for the exact diagnostic revision on Vercel branch alias
        shell: bash
        run: |
          if [ -z "$VERCEL_PROTECTION_BYPASS" ]; then
            echo "VERCEL_PROTECTION_BYPASS missing; refusing provider generation."
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 48); do
            body=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/bokamoso?format=meta" 2>/dev/null || true)
            if printf '%s' "$body" | grep -Fq '"diagnosticRevision":"semantic-audit-v1"'; then
              printf '%s\n' "$body"
              ready=1
              break
            fi
            echo "waiting for semantic-audit-v1 deployment ($attempt/48)"
            sleep 5
          done
          [ "$ready" -eq 1 ] || { echo "Diagnostic deployment did not become ready; refusing provider generation."; exit 1; }

      - name: Prove bounded assurance safety regressions
        shell: bash
        run: |
          NODE_TEST="node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs"
          $NODE_TEST scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs
          $NODE_TEST scripts/commercial-quality/narrative-assurance-semantics-tests.mjs
          $NODE_TEST scripts/commercial-quality/essential-validation-cascade-regression.mjs

      - name: Generate Bokamoso V1.2 Essential exactly once
        shell: bash
        run: |
          mkdir -p v12-reports qa-output/v12-essential
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const base = process.env.PREVIEW_URL.replace(/\/$/, '');
          const bypass = process.env.VERCEL_PROTECTION_BYPASS;
          const headers = { 'x-vercel-protection-bypass': bypass };
          const metaResponse = await fetch(`${base}/score/api/qa/v12-essential-comparison/bokamoso?format=meta`, { headers });
          const meta = await metaResponse.json();
          if (!metaResponse.ok) throw new Error(`metadata HTTP ${metaResponse.status}`);
          if (meta.diagnosticRevision !== 'semantic-audit-v1') throw new Error(`wrong diagnostic revision ${meta.diagnosticRevision}`);
          if (meta.graphVersion !== 'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821') throw new Error(`wrong graph ${meta.graphVersion}`);
          if (meta.methodology !== 'MFRS-V1.2-CANDIDATE-OWNER-CORRECTION') throw new Error(`wrong methodology ${meta.methodology}`);
          console.log(`Bokamoso V1.2: score ${meta.score}, ${meta.finalMaturity}; issuing one generation request.`);
          const response = await fetch(`${base}/score/api/qa/v12-essential-comparison/bokamoso`, { headers });
          const contentType = response.headers.get('content-type') || '';
          if (!response.ok) {
            const text = await response.text();
            fs.writeFileSync('qa-output/v12-essential/bokamoso-latest-failure.json', text);
            console.error(text);
            throw new Error(`Bokamoso generation failed HTTP ${response.status}`);
          }
          if (!contentType.includes('application/pdf')) throw new Error(`unexpected content-type ${contentType}`);
          const bytes = Buffer.from(await response.arrayBuffer());
          if (bytes.length < 100000 || bytes.subarray(0,4).toString() !== '%PDF') throw new Error(`invalid PDF (${bytes.length} bytes)`);
          const file = 'Bokamoso_Skills_Institute_Essential_V1_2.pdf';
          fs.writeFileSync(`v12-reports/${file}`, bytes);
          const summary = { ...meta, file, bytes: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          fs.writeFileSync('v12-reports/summary.json', JSON.stringify([summary], null, 2));
          console.log(`BOKAMOSO V1.2 ESSENTIAL: PASS ${bytes.length} bytes ${summary.sha256}`);
          NODE

      - name: Upload Bokamoso proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-bokamoso-proof
          path: v12-reports/*
          if-no-files-found: error
          retention-days: 14

      - name: Commit failure diagnostic
        if: failure()
        shell: bash
        run: |
          if [ ! -f qa-output/v12-essential/bokamoso-latest-failure.json ]; then exit 0; fi
          git config user.name "MK V1.2 QA"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin qa/v12-essential-comparison-20260823
          git reset --soft origin/qa/v12-essential-comparison-20260823
          git add qa-output/v12-essential/bokamoso-latest-failure.json
          git commit -m "record Bokamoso V1.2 semantic diagnostic" || exit 0
          git push origin HEAD:qa/v12-essential-comparison-20260823
