name: Essential V1.2 Three-Report Generation

on:
  push:
    branches:
      - qa/v12-essential-comparison-20260823
    paths:
      - .github/workflows/essential-v12-comparison-generate.yml

permissions:
  contents: read

jobs:
  generate-three:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-comparison-20260823

      - name: Provider preflight
        shell: bash
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ] && [ -z "$VERCEL_AI_GATEWAY_API_KEY" ]; then
            echo "No repository AI Gateway secret is configured; refusing generation before provider dispatch."
            exit 1
          fi
          echo "Approved AI Gateway credential is available."

      - name: Install and build exact branch
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Start isolated application server
        shell: bash
        run: |
          npm start -- -p 3000 > /tmp/mk-v12-next.log 2>&1 &
          echo $! > /tmp/mk-v12-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/score/api/qa/v12-essential-comparison/bokamoso?format=meta >/tmp/v12-meta.json; then
              cat /tmp/v12-meta.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mk-v12-next.log || true
          exit 1

      - name: Generate three exact V1.2 Essential PDFs
        shell: bash
        run: |
          mkdir -p v12-reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const base = 'http://127.0.0.1:3000';
          const reports = [
            { profile: 'bokamoso', name: 'Bokamoso_Skills_Institute_Essential_V1_2.pdf' },
            { profile: 'siyakhula', name: 'Siyakhula_Community_Foundation_Essential_V1_2.pdf' },
            { profile: 'vhutshilo', name: 'Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' }
          ];
          const summary = [];

          for (let index = 0; index < reports.length; index += 1) {
            const report = reports[index];
            const metaResponse = await fetch(`${base}/score/api/qa/v12-essential-comparison/${report.profile}?format=meta`);
            const meta = await metaResponse.json();
            if (!metaResponse.ok) throw new Error(`${report.profile}: metadata failed ${JSON.stringify(meta).slice(0,500)}`);
            if (meta.graphVersion !== 'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821') throw new Error(`${report.profile}: wrong graph ${meta.graphVersion}`);
            if (meta.methodology !== 'MFRS-V1.2-CANDIDATE-OWNER-CORRECTION') throw new Error(`${report.profile}: wrong methodology ${meta.methodology}`);

            console.log(`[${index + 1}/3] ${report.profile}: ${meta.score} ${meta.finalMaturity}; exactly one generation request.`);
            const response = await fetch(`${base}/score/api/qa/v12-essential-comparison/${report.profile}`);
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`${report.profile}: generation HTTP ${response.status}: ${text.slice(0,1500)}`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length < 100000 || bytes.subarray(0,4).toString() !== '%PDF') throw new Error(`${report.profile}: invalid PDF (${bytes.length} bytes)`);
            fs.writeFileSync(`v12-reports/${report.name}`, bytes);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            summary.push({ ...meta, file: report.name, bytes: bytes.length, sha256 });
            console.log(`[${index + 1}/3] PASS ${report.name}: ${bytes.length} bytes; ${sha256}`);
          }

          fs.writeFileSync('v12-reports/summary.json', JSON.stringify(summary, null, 2));
          console.log('ESSENTIAL V1.2 THREE-REPORT GENERATION: PASS 3/3');
          NODE

      - name: Preserve server diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mk-v12-next.log ]; then tail -n 400 /tmp/mk-v12-next.log > v12-server.log || true; fi

      - name: Upload V1.2 Essential reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: essential-v12-three-report-pack
          path: |
            v12-reports/*
            v12-server.log
          if-no-files-found: error
          retention-days: 14
