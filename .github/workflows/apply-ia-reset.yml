name: Apply approved website reset
on:
  push:
    branches:
      - website/ia-mobile-reset
    paths:
      - '.tmp/ia-reset/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website/ia-mobile-reset
          fetch-depth: 0
      - name: Reconstruct and apply approved patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/ia-reset/00 .tmp/ia-reset/01 .tmp/ia-reset/02 .tmp/ia-reset/03 .tmp/ia-reset/04 .tmp/ia-reset/05 .tmp/ia-reset/06 .tmp/ia-reset/07 .tmp/ia-reset/08 .tmp/ia-reset/09 .tmp/ia-reset/10 .tmp/ia-reset/11 > /tmp/website-reset.patch.b64
          base64 -d /tmp/website-reset.patch.b64 > /tmp/website-reset.patch.gz
          set +e
          gzip -dc /tmp/website-reset.patch.gz > /tmp/website-reset.patch
          gzip_status=$?
          set -e
          echo "gzip_status=$gzip_status"
          echo "patch_sha=$(sha256sum /tmp/website-reset.patch | awk '{print $1}')"
          echo "patch_bytes=$(wc -c < /tmp/website-reset.patch)"
          echo "--- diff headers 4850-6200 ---"
          nl -ba /tmp/website-reset.patch | sed -n '4850,6200p' | grep -E 'diff --git|^ *[0-9]+[[:space:]]+index |^ *[0-9]+[[:space:]]+--- |^ *[0-9]+[[:space:]]+\+\+\+' || true
          echo "--- raw 4980-5060 ---"
          sed -n '4980,5060p' /tmp/website-reset.patch
          echo "--- end ---"
          exit 1
      - name: Commit approved website state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/ia-reset
          rm -f .github/workflows/apply-ia-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply approved website IA, mobile and AI fraud reset"
          git push origin HEAD:website/ia-mobile-reset
