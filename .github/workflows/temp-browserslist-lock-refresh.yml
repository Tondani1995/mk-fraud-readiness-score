name: Temporary Browserslist Lock Refresh

on:
  push:
    branches:
      - hotfix/comprehensive-manuscript-production-propagation-20260904
    paths:
      - .github/workflows/temp-browserslist-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-manuscript-production-propagation-20260904
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh only the vulnerable Browserslist resolution
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.original
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = { ...(p.overrides || {}), browserslist: '4.28.7' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp /tmp/package.json.original package.json
          test "$(node -p "require('./package-lock.json').packages['node_modules/browserslist'].version")" = "4.28.7"

      - name: Prove the refreshed lock is valid and removes blocking production audit findings
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          git diff --check
          git diff -- package-lock.json

      - name: Commit the generated lock only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- package.json)"
          test -n "$(git status --porcelain -- package-lock.json)"
          git config user.name "MK CI Lock Refresh"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: update Browserslist to patched 4.28.7"
          git push origin HEAD:hotfix/comprehensive-manuscript-production-propagation-20260904
