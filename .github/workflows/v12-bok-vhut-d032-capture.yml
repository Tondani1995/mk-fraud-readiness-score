name: V1.2 Bokamoso Vhutshilo Final Capture
on:
  push:
    branches: [qa/v12-essential-five-layer-proof-20260823]
    paths: [.github/workflows/v12-bok-vhut-d032-capture.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://mk-fraud-platform-b2h2p5gs0-tondanis-projects.vercel.app
      SOURCE_DEPLOYMENT: dpl_DBsdLHhbaAVEmaeGqgpQxKqq7e3e
      SOURCE_SHA: d032ba3b8f0db46f927d8572d4dd6850b3d5caa0
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0
      - name: Capture two remaining profiles once each
        shell: bash
        run: |
          set -u
          test -n "$VERCEL_PROTECTION_BYPASS" || exit 1
          out=qa-output/v12-bok-vhut-d032
          rm -rf "$out" && mkdir -p "$out"
          safety=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-safety-proof")
          printf '%s\n' "$safety" > "$out/safety.json"
          printf '%s' "$safety" | grep -Fq '"ok":true' || exit 1
          node -e "require('fs').writeFileSync('$out/source.json', JSON.stringify({sourceDeployment:process.env.SOURCE_DEPLOYMENT,sourceSha:process.env.SOURCE_SHA},null,2)+'\n')"
          for profile in bokamoso vhutshilo; do
            case "$profile" in
              bokamoso) name='Bokamoso_Skills_Institute_Essential_V1_2.pdf' ;;
              vhutshilo) name='Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' ;;
            esac
            meta=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile?format=meta")
            printf '%s\n' "$meta" > "$out/${profile}-meta.json"
            code=$(curl -sS -w '%{http_code}' -D "$out/${profile}-headers.txt" -o "$out/${profile}-response.bin" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile")
            printf '%s\n' "$code" > "$out/${profile}-http-code.txt"
            if [ "$code" = 200 ] && head -c 4 "$out/${profile}-response.bin" | grep -q '%PDF'; then
              mv "$out/${profile}-response.bin" "$out/$name"
              sha256sum "$out/$name" > "$out/${profile}-sha256.txt"
              echo success > "$out/${profile}-outcome.txt"
            else
              mv "$out/${profile}-response.bin" "$out/${profile}-diagnostic.json"
              echo held_or_failed > "$out/${profile}-outcome.txt"
            fi
          done
      - name: Commit capture evidence
        shell: bash
        run: |
          git config user.name 'MK V1.2 QA'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-output/v12-bok-vhut-d032
          git commit -m 'capture Bokamoso and Vhutshilo on d032 V1.2 source' || true
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: v12-bok-vhut-d032-capture
          path: qa-output/v12-bok-vhut-d032/*
          retention-days: 14
