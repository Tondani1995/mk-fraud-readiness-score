name: Apply Essential V5.1 commercial cleanup

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
    paths:
      - .github/workflows/apply-essential-assurance-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply staged deterministic V5.1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          workflow = Path('.github/workflows/one-off-essential-v5-cleanup.yml').read_text()
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('staged V5.1 Python patch block not found')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
          with tempfile.NamedTemporaryFile('w', suffix='.py', delete=False) as handle:
              handle.write(code)
              patch_file = handle.name
          subprocess.run(['python', patch_file], check=True)
          PY

      - name: Prove V5.1 cleanup provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v5-cleanup-regression.mjs

      - name: Prove existing Essential report regressions
        run: |
          npx tsx --test scripts/commercial-quality/essential-output-budget-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-assurance-boundary-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-risk-cause-specificity-tests.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Commit deterministic cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reports/evidence-model/material-findings.ts \
            src/lib/reports/evidence-model/registers.ts \
            src/lib/reports/essential-presentation-adaptation.ts \
            src/lib/reports/templates/report-template.ts \
            src/components/admin/FulfilmentActions.tsx \
            scripts/commercial-quality/essential-v5-cleanup-regression.mjs \
            .github/workflows/essential-provider-diagnostics.yml
          git commit -m "Polish Essential V5 customer report and generation UX"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
