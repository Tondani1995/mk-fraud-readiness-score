name: V10 Final Rendered Certification

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality

permissions:
  contents: write

jobs:
  rendered-certification:
    if: github.event.head_commit.message == 'Run V10 rendered certification'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      V7_ARTIFACT_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out commercial branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rendered PDF audit dependencies
        shell: bash
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          python3 -m pip install --disable-pip-version-check --no-cache-dir pillow pypdf
          command -v pdftoppm

      - name: Run rendered certification and persist exact disposition
        shell: bash
        run: |
          set +e
          python3 scripts/checkpoint-f-pdf-audit.py --self-test-section-heading-rule
          self_test_status=$?
          gate_status=0
          if [ "$self_test_status" -eq 0 ]; then
            npm run v7:test-checkpoint-f
            gate_status=$?
          else
            gate_status=$self_test_status
          fi
          export GATE_STATUS="$gate_status"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path('scripts/commercial-quality/.v9-rendered-certification-status')
          gate_status = int(os.environ.get('GATE_STATUS', '1'))
          lines = [
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"source_sha={os.environ.get('GITHUB_SHA', '')}",
              f"status={'success' if gate_status == 0 else 'failure'}",
          ]
          audit = Path('tmp/pdfs/checkpoint-f-artifact/inspection/pdf-audit.json')
          if audit.exists():
              data = json.loads(audit.read_text())
              failures = [item for item in data.get('checks', []) if not item.get('passed')]
              lines.append(f"failure_count={len(failures)}")
              for index, item in enumerate(failures[:20], 1):
                  detail = str(item.get('detail', '')).replace('\n', ' ').strip()
                  lines.append(f"failure_{index}={item.get('code')} | {item.get('candidate')} | {detail}")
          else:
              lines.append('failure_count=unknown')
              lines.append('failure_1=rendered audit JSON not produced; inspect structural self-test or render command')
          status_path.write_text('\n'.join(lines) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/commercial-quality/.v9-rendered-certification-status
          git commit -m "Record V10 rendered certification disposition"
          git pull --rebase --autostash origin commercial/mk-fraud-readiness-95-quality
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
          exit "$gate_status"
