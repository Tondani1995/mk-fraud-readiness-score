name: Temporary Comprehensive scenario projection hotfix

on:
  push:
    branches:
      - hotfix/comprehensive-scenario-projection-20260905

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/comprehensive-scenario-projection-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply bounded narrative scenario projection repair
        run: python scripts/temporary-apply-comprehensive-scenario-projection-hotfix.py
      - name: Run existing Essential scenario regression
        run: node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-scenario-topup-regression.mjs
      - name: Run Comprehensive projection regression
        run: node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/comprehensive-scenario-projection-topup-regression.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified hotfix
        run: |
          git config user.name 'MK Comprehensive Scenario Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/reports/narrative/fact-pack.ts scripts/commercial-quality/comprehensive-scenario-projection-topup-regression.mjs
          git commit -m 'fix(comprehensive): preserve evidence-backed scenario variants in narrative projection'
          git push origin HEAD:hotfix/comprehensive-scenario-projection-20260905
