name: Import exact Claude acceptance tree

on:
  push:
    branches:
      - claude-exact-import-workflow

permissions:
  contents: write

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and publish exact Claude commits
        shell: bash
        run: |
          set -euo pipefail
          cat \
            _claude_bundle/chunk-00 \
            _claude_bundle/chunk-01 \
            _claude_bundle/chunk-02 \
            _claude_bundle/chunk-03-0 \
            _claude_bundle/chunk-03-1 \
            | base64 -d > /tmp/essential-validation-cascade-unification.bundle
          echo "82726928d9233076c6077f81a961ad391b901d0ddd4f0c775781abdbf49da1be  /tmp/essential-validation-cascade-unification.bundle" | sha256sum -c -
          git bundle verify /tmp/essential-validation-cascade-unification.bundle
          git bundle list-heads /tmp/essential-validation-cascade-unification.bundle | grep '^23fb3ea2d04d2c976c3a53e727b062a27c64694d HEAD$'
          git fetch /tmp/essential-validation-cascade-unification.bundle HEAD:refs/heads/claude-final
          test "$(git rev-parse claude-final)" = "23fb3ea2d04d2c976c3a53e727b062a27c64694d"
          test "$(git rev-parse claude-final^)" = "53c6764b68d4915a31e7b847b32de9b0f347315d"
          test "$(git rev-parse claude-final^^)" = "f99b862591758581312ceaa52206ae7f78edd7ea"
          test "$(git rev-parse claude-final^{tree})" = "711cc1d746c26e8b3dbf9e297acd7224ee271fde"
          git push origin 23fb3ea2d04d2c976c3a53e727b062a27c64694d:refs/heads/commercial/mk-fraud-readiness-95-quality
