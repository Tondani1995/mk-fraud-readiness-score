name: Recovered V1.2 Vhutshilo Essential Capture

on:
  push:
    branches:
      - recovery/essential-v10-v12-brand-20260824
    paths:
      - .github/workflows/essential-v12-final-same-sha-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://mk-fraud-platform-dr2pjhebk-tondanis-projects.vercel.app
      SOURCE_DEPLOYMENT: dpl_7EQZykBKsG71e2n9XjMN7BpDvqbA
      SOURCE_SHA: b6ee7c89d74e1492eaa5f290aae8bed80a00185c
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/essential-v10-v12-brand-20260824
          fetch-depth: 0

      - name: Prove frozen Vhutshilo truth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_PROTECTION_BYPASS"
          rm -rf qa-output/recovered-vhutshilo-essential
          mkdir -p qa-output/recovered-vhutshilo-essential
          curl --max-time 60 -fsS \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            "$PREVIEW_URL/score/api/qa/v12-essential-comparison/vhutshilo?format=meta" \
            > qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"score":43.33' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"finalMaturity":"Developing"' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"applicableControls":60' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"excludedControls":8' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"redirectedControls":4' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"unknownControls":0' qa-output/recovered-vhutshilo-essential/meta.json
          grep -Fq '"graphVersion":"MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821"' qa-output/recovered-vhutshilo-essential/meta.json
          printf '{"sourceDeployment":"%s","sourceSha":"%s"}\n' "$SOURCE_DEPLOYMENT" "$SOURCE_SHA" > qa-output/recovered-vhutshilo-essential/source.json

      - name: Generate Vhutshilo Essential exactly once
        shell: bash
        run: |
          set +e
          code=$(curl --max-time 300 -sS -w '%{http_code}' \
            -D qa-output/recovered-vhutshilo-essential/headers.txt \
            -o qa-output/recovered-vhutshilo-essential/response.bin \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            "$PREVIEW_URL/score/api/qa/v12-essential-comparison/vhutshilo")
          printf '%s\n' "$code" > qa-output/recovered-vhutshilo-essential/http-code.txt
          if [ "$code" = "200" ] && [ "$(head -c 4 qa-output/recovered-vhutshilo-essential/response.bin)" = '%PDF' ]; then
            mv qa-output/recovered-vhutshilo-essential/response.bin qa-output/recovered-vhutshilo-essential/Vhutshilo_Foods_Manufacturing_Essential_V1_2_Recovered.pdf
            sha256sum qa-output/recovered-vhutshilo-essential/Vhutshilo_Foods_Manufacturing_Essential_V1_2_Recovered.pdf > qa-output/recovered-vhutshilo-essential/sha256.txt
            wc -c < qa-output/recovered-vhutshilo-essential/Vhutshilo_Foods_Manufacturing_Essential_V1_2_Recovered.pdf > qa-output/recovered-vhutshilo-essential/bytes.txt
            echo SUCCESS > qa-output/recovered-vhutshilo-essential/outcome.txt
            exit 0
          fi
          mv qa-output/recovered-vhutshilo-essential/response.bin qa-output/recovered-vhutshilo-essential/diagnostic.json
          echo FAIL > qa-output/recovered-vhutshilo-essential/outcome.txt
          exit 1

      - name: Commit capture
        if: always()
        shell: bash
        run: |
          git config user.name "MK Recovery QA"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin recovery/essential-v10-v12-brand-20260824
          git reset --soft origin/recovery/essential-v10-v12-brand-20260824
          git add qa-output/recovered-vhutshilo-essential
          git commit -m "capture recovered Vhutshilo Essential artefact" || true
          git push origin HEAD:recovery/essential-v10-v12-brand-20260824

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-vhutshilo-essential
          path: qa-output/recovered-vhutshilo-essential
          if-no-files-found: error
          retention-days: 14
