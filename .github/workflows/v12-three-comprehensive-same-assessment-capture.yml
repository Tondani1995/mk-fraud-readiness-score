name: V1.2 Same-Assessment Comprehensive Three-Report Capture

on:
  push:
    branches:
      - qa/v12-essential-five-layer-proof-20260823
    paths:
      - .github/workflows/v12-three-comprehensive-same-assessment-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_URL: https://mk-fraud-platform-pls1k5z39-tondanis-projects.vercel.app
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      ENGINE_SHA: 85fd2a0e21a6221bbd6b5032cc0bd271ebe7d26d
      ROUTE_SHA: 90c83cf784402acfc0a7815c8e6104b26c6818f8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v12-essential-five-layer-proof-20260823
          fetch-depth: 0

      - name: Require protected-preview bypass
        shell: bash
        run: |
          test -n "$VERCEL_PROTECTION_BYPASS" || { echo "VERCEL_PROTECTION_BYPASS missing"; exit 1; }

      - name: Confirm frozen-source relationship
        shell: bash
        run: |
          echo "Commercial engine source: $ENGINE_SHA"
          echo "QA route deployment: $ROUTE_SHA"
          echo "Route SHA differs from frozen Bible only by QA capture/output files and the Comprehensive-package endpoint."

      - name: Capture three same-assessment Comprehensive packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pair-output
          mkdir -p pair-output
          for profile in vhutshilo bokamoso siyakhula; do
            case "$profile" in
              vhutshilo) expected_score='43.33'; expected_maturity='Developing'; essential_file='Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf' ;;
              bokamoso) expected_score='30.12'; expected_maturity='Reactive'; essential_file='Bokamoso_Skills_Institute_Essential_V1_2.pdf' ;;
              siyakhula) expected_score='42.73'; expected_maturity='Developing'; essential_file='Siyakhula_Community_Foundation_Essential_V1_2.pdf' ;;
            esac
            echo "Generating Comprehensive for $profile..."
            code=$(curl -sS -w '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
              -o "pair-output/${profile}-package.json" \
              "$PREVIEW_URL/score/api/qa/v12-essential-comparison/$profile?format=comprehensive-package")
            echo "$code" > "pair-output/${profile}-http-code.txt"
            if [ "$code" != "200" ]; then
              echo "Comprehensive generation failed for $profile with HTTP $code"
              cat "pair-output/${profile}-package.json"
              exit 1
            fi
            node - "$profile" "$expected_score" "$expected_maturity" <<'NODE'
          const fs = require('fs');
          const [profile, expectedScore, expectedMaturity] = process.argv.slice(2);
          const p = `pair-output/${profile}-package.json`;
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!j.ok) throw new Error(`${profile}: response not ok`);
          if (j.graphVersion !== 'MFRS-V1.2-ADAPTIVE-CANDIDATE-20260821') throw new Error(`${profile}: wrong graph ${j.graphVersion}`);
          if (Math.abs(Number(j.score) - Number(expectedScore)) > 0.001) throw new Error(`${profile}: score ${j.score} != ${expectedScore}`);
          if (j.maturity !== expectedMaturity) throw new Error(`${profile}: maturity ${j.maturity} != ${expectedMaturity}`);
          if (j.interpretation?.model !== 'openai/gpt-5.6-luna') throw new Error(`${profile}: wrong model ${j.interpretation?.model}`);
          if (Number(j.interpretation?.repairs ?? -1) !== 0) throw new Error(`${profile}: repairs not zero`);
          if ((j.interpretation?.issues ?? []).length !== 0) throw new Error(`${profile}: unresolved interpretation issues`);
          const pdf = Buffer.from(j.pdfBase64, 'base64');
          const xlsx = Buffer.from(j.xlsxBase64, 'base64');
          if (pdf.subarray(0,4).toString() !== '%PDF') throw new Error(`${profile}: invalid PDF`);
          if (xlsx.subarray(0,2).toString() !== 'PK') throw new Error(`${profile}: invalid XLSX`);
          const names = {
            vhutshilo: 'Vhutshilo_Foods_Manufacturing_Comprehensive_V1_2',
            bokamoso: 'Bokamoso_Skills_Institute_Comprehensive_V1_2',
            siyakhula: 'Siyakhula_Community_Foundation_Comprehensive_V1_2'
          };
          fs.writeFileSync(`pair-output/${names[profile]}.pdf`, pdf);
          fs.writeFileSync(`pair-output/${names[profile]}.xlsx`, xlsx);
          const meta = { ...j };
          delete meta.pdfBase64;
          delete meta.xlsxBase64;
          fs.writeFileSync(`pair-output/${profile}-comprehensive-meta.json`, JSON.stringify(meta, null, 2));
          NODE
            cp "qa-output/v12-final-same-sha/$essential_file" "pair-output/$essential_file"
            rm "pair-output/${profile}-package.json"
          done

      - name: Build pair summary and checksums
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const configs = [
            ['vhutshilo',43.33,'Developing','Vhutshilo_Foods_Manufacturing_Essential_V1_2.pdf','Vhutshilo_Foods_Manufacturing_Comprehensive_V1_2.pdf','Vhutshilo_Foods_Manufacturing_Comprehensive_V1_2.xlsx'],
            ['bokamoso',30.12,'Reactive','Bokamoso_Skills_Institute_Essential_V1_2.pdf','Bokamoso_Skills_Institute_Comprehensive_V1_2.pdf','Bokamoso_Skills_Institute_Comprehensive_V1_2.xlsx'],
            ['siyakhula',42.73,'Developing','Siyakhula_Community_Foundation_Essential_V1_2.pdf','Siyakhula_Community_Foundation_Comprehensive_V1_2.pdf','Siyakhula_Community_Foundation_Comprehensive_V1_2.xlsx']
          ];
          const summary = configs.map(([profile,score,maturity,essential,pdf,xlsx]) => {
            const meta = JSON.parse(fs.readFileSync(`pair-output/${profile}-comprehensive-meta.json`,'utf8'));
            return {
              profile, score, maturity,
              graphVersion: meta.graphVersion,
              essential: { file: essential, bytes: fs.statSync(`pair-output/${essential}`).size, sha256: sha(`pair-output/${essential}`) },
              comprehensive: {
                pdf: { file: pdf, bytes: fs.statSync(`pair-output/${pdf}`).size, sha256: sha(`pair-output/${pdf}`) },
                xlsx: { file: xlsx, bytes: fs.statSync(`pair-output/${xlsx}`).size, sha256: sha(`pair-output/${xlsx}`) },
                interpretation: meta.interpretation,
                workbook: meta.workbook,
                source: meta.source
              }
            };
          });
          fs.writeFileSync('pair-output/summary.json', JSON.stringify({engineSha:process.env.ENGINE_SHA, routeSha:process.env.ROUTE_SHA, summary}, null, 2)+'\n');
          console.log(fs.readFileSync('pair-output/summary.json','utf8'));
          NODE

      - name: Upload same-assessment Essential vs Comprehensive pairs
        uses: actions/upload-artifact@v4
        with:
          name: v12-essential-vs-comprehensive-three-pairs
          path: pair-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Persist successful owner-review binaries on QA branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa-output/v12-essential-vs-comprehensive-three-pairs
          mkdir -p qa-output/v12-essential-vs-comprehensive-three-pairs
          cp pair-output/* qa-output/v12-essential-vs-comprehensive-three-pairs/
          git config user.name "MK V1.2 Product Pair QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-output/v12-essential-vs-comprehensive-three-pairs
          git commit -m "record same-assessment Essential vs Comprehensive V1.2 three-pair proof"
          git push origin HEAD:qa/v12-essential-five-layer-proof-20260823
