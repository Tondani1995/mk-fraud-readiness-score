name: One-off Essential output-budget patch

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
    paths:
      - scripts/maintenance/patch-essential-output-budget.mjs
      - .github/workflows/one-off-essential-output-budget-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct provider output budgeting
        run: node scripts/maintenance/patch-essential-output-budget.mjs

      - name: Verify corrected source
        run: |
          grep -F "OUTPUT_BUDGET_TOKENS_PER_WORD = 1.5" src/lib/reports/narrative/report-blueprint.ts
          grep -F "Math.ceil(expectedWordRange.maximum * OUTPUT_BUDGET_TOKENS_PER_WORD)" src/lib/reports/narrative/report-blueprint.ts

      - name: Remove one-off patch machinery
        run: |
          rm scripts/maintenance/patch-essential-output-budget.mjs
          rm .github/workflows/one-off-essential-output-budget-patch.yml

      - name: Commit corrected budget source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct Essential output token budgeting"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
