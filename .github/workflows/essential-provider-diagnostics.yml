name: Report Provider-Free Regressions

# Permanent report acceptance gate. The temporary navigation-closure job below is isolated and
# removed immediately after its source commit lands; report-regressions itself remains provider-free.
on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  navigation-closure:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'commercial/mk-fraud-readiness-95-quality'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out commercial branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Apply focused V9 navigation closure
        run: |
          python3 scripts/commercial-quality/apply-v9-navigation-closure.py
          git diff --check
          node --check scripts/commercial-quality/essential-v9-second-opinion-regression.mjs

      - name: Commit source closure if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reports/templates/report-template.ts \
            src/lib/reports/pdf-navigation.ts \
            scripts/commercial-quality/essential-v9-second-opinion-regression.mjs
          if git diff --cached --quiet; then
            echo "V9 navigation closure already applied."
            exit 0
          fi
          git commit -m "Close V9 rendered navigation defect"
          git pull --rebase origin commercial/mk-fraud-readiness-95-quality
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality

  report-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider-free Essential diagnostics
        run: npm run v11:narrative-diagnostics

      - name: Prove Essential output budget and one-call guard
        run: npx tsx --test scripts/commercial-quality/essential-output-budget-tests.mjs

      - name: Prove Essential assurance boundary provider-free
        run: npx tsx --test scripts/commercial-quality/essential-assurance-boundary-tests.mjs

      - name: Prove Essential numeric claim equivalence provider-free
        run: npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs

      - name: Prove Essential manuscript render binding provider-free
        run: npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs

      - name: Prove Essential risk cause specificity provider-free
        run: npx tsx --test scripts/commercial-quality/essential-risk-cause-specificity-tests.mjs

      - name: Prove Essential V5.1 customer-visible cleanup provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v5-cleanup-regression.mjs

      - name: Prove Essential V6 final polish provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v6-final-polish-regression.mjs

      - name: Prove Essential V7 final acceptance fixes provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs

      - name: Prove Essential V9 second-opinion closure provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v9-second-opinion-regression.mjs

      - name: Run provider-free Comprehensive customer-visible regressions
        run: npx tsx --test scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs

      - name: Typecheck
        run: npm run typecheck
