name: Report Provider-Free Regressions

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  report-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Essential manuscript binding patch
        run: python scripts/commercial-quality/run-essential-binding-no-workflow-mutation.py

      - name: Prove Essential manuscript render binding provider-free
        run: npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs

      - name: Commit provider-free binding fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No binding changes to commit."
            exit 0
          fi
          git commit -m "Bind Essential manuscript into customer report"
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
