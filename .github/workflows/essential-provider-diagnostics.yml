name: Report Provider-Free Regressions

on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  report-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: commercial/mk-fraud-readiness-95-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic V7 final acceptance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/commercial-quality/apply-v7-final-acceptance.py')
          text = path.read_text()
          marker = '# Add the permanent provider-free gate step after V6 final polish.'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n\nprint("V7 deterministic final acceptance fixes applied")\n'
              path.write_text(text)
          PY
          python scripts/commercial-quality/apply-v7-final-acceptance.py

      - name: Run complete provider-free report regressions
        run: |
          npm run v11:narrative-diagnostics
          npx tsx --test scripts/commercial-quality/essential-output-budget-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-assurance-boundary-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-risk-cause-specificity-tests.mjs
          npx tsx --test scripts/commercial-quality/essential-v5-cleanup-regression.mjs
          npx tsx --test scripts/commercial-quality/essential-v6-final-polish-regression.mjs
          npx tsx --test scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs
          npx tsx --test scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs
          npm run typecheck

      - name: Commit and push proven source changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/reports/narrative/assurance-boundary-normalisation.ts \
            src/lib/reports/essential-presentation-adaptation.ts \
            src/lib/reports/templates/report-template.ts \
            scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs
          if git diff --cached --quiet; then
            echo "No V7 source changes to commit."
          else
            git commit -m "Fix final Essential V7 commercial acceptance defects"
          fi
          git restore .github/workflows/essential-provider-diagnostics.yml
          git restore scripts/commercial-quality/apply-v7-final-acceptance.py
          git pull --rebase origin commercial/mk-fraud-readiness-95-quality
          git push origin HEAD:commercial/mk-fraud-readiness-95-quality
