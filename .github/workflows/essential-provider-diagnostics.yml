name: Report Provider-Free Regressions

# Permanent read-only report acceptance gate. No provider calls are permitted here.
on:
  push:
    branches:
      - commercial/mk-fraud-readiness-95-quality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  report-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider-free Essential diagnostics
        run: npm run v11:narrative-diagnostics

      - name: Prove Essential output budget and one-call guard
        run: npx tsx --test scripts/commercial-quality/essential-output-budget-tests.mjs

      - name: Prove Essential assurance boundary provider-free
        run: npx tsx --test scripts/commercial-quality/essential-assurance-boundary-tests.mjs

      - name: Prove MUST_ALLOW / MUST_REPAIR / MUST_REJECT false-positive safety net
        run: node --experimental-strip-types --experimental-loader=./scripts/lib/ts-relative-resolve-loader.mjs scripts/commercial-quality/essential-false-positive-safety-net-tests.mjs

      - name: Prove canonical layered validation cascade
        run: npx tsx --test scripts/commercial-quality/essential-validation-cascade-regression.mjs

      - name: Prove shared assurance/context adjudication core against the consolidated corpus
        run: npx tsx --test scripts/commercial-quality/assurance-adjudication-corpus-regression.mjs

      - name: Prove cascade layer semantics (NOT_APPLICABLE, live evidence comparison, carry-forward, HELD_FOR_REVIEW)
        run: npx tsx --test scripts/commercial-quality/essential-layer-semantics-regression.mjs

      - name: Prove deterministic evidence-proof-purpose and Recommended Next Step prose against the shared corpus
        run: npx tsx --test scripts/commercial-quality/essential-deterministic-prose-adjudication-regression.mjs

      - name: Prove repair-then-immutable-final-acceptance allows no post-acceptance mutation
        run: npx tsx --test scripts/commercial-quality/essential-final-acceptance-immutability-regression.mjs

      - name: Prove Essential numeric claim equivalence provider-free
        run: npx tsx --test scripts/commercial-quality/essential-numeric-claim-tests.mjs

      - name: Prove Essential manuscript render binding provider-free
        run: npx tsx --test scripts/commercial-quality/essential-manuscript-render-binding-tests.mjs

      - name: Prove Essential risk cause specificity provider-free
        run: npx tsx --test scripts/commercial-quality/essential-risk-cause-specificity-tests.mjs

      - name: Prove Essential V5.1 customer-visible cleanup provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v5-cleanup-regression.mjs

      - name: Prove Essential V6 final polish provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v6-final-polish-regression.mjs

      - name: Prove Essential V7 final acceptance fixes provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v7-final-acceptance-regression.mjs

      - name: Prove Essential V9 second-opinion closure provider-free
        run: npx tsx --test scripts/commercial-quality/essential-v9-second-opinion-regression.mjs

      - name: Prove Bokamoso commercial closure provider-free
        run: npx tsx --test scripts/commercial-quality/essential-bokamoso-commercial-closure-regression.mjs

      - name: Run provider-free Comprehensive customer-visible regressions
        run: npx tsx --test scripts/commercial-quality/comprehensive-customer-visible-adaptation-tests.mjs

      - name: Typecheck
        run: npm run typecheck
