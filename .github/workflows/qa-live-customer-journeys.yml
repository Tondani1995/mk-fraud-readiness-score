name: Owner-approved live customer journeys (one-off)
on:
  push:
    branches: [qa/live-customer-journeys-20261125]
    paths: ['.github/workflows/qa-live-customer-journeys.yml']
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated exact Playwright package and matching Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/mk-browser"
          npm install --prefix "$RUNNER_TEMP/mk-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/mk-browser/node_modules/playwright/cli.js" --version
          node "$RUNNER_TEMP/mk-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "MK_QA_PLAYWRIGHT=$RUNNER_TEMP/mk-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Retry only uncreated Comprehensive assessment and unconfirmed booking
        run: node scripts/qa-live-customer-journeys-20261125.cjs
