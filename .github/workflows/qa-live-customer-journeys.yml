name: Owner-approved live customer journeys (one-off)
on:
  push:
    branches: [qa/live-customer-journeys-20261125]
    paths: ['.github/workflows/qa-live-customer-journeys.yml']
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run exactly two live customer assessments, invoices, service enquiry and booking
        run: node scripts/qa-live-customer-journeys-20261125.cjs
